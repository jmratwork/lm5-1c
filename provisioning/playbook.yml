---
- name: Configuring Docker-Server
  hosts: docker-server
  become: yes
  roles:
    - docker_server

- name: Configuring NG-SIEM
  hosts: ng-siem
  become: yes
  # A PUC2 ruleset analysisd refuses does not degrade a training level, it stops
  # wazuh-manager from starting — and then THIS play dies at its own "Restart
  # wazuh-manager" long before the PUC2 role could deploy a corrected file. The
  # range deadlocks: the bad file blocks the manager, and the fix cannot reach
  # the host. ng_siem_rules_2c validates before restarting, but that only helps
  # when the run gets that far. This is the other half of the guard, and it runs
  # before anything asks the manager to start.
  #
  # No-op on a healthy range: it only acts when analysisd itself rejects the
  # file, so a working ruleset is never touched.
  pre_tasks:
    - name: Look for a previously deployed PUC2 2c ruleset
      ansible.builtin.stat:
        path: /var/ossec/ruleset/rules/9999-puc2-2c.xml
      register: puc2_prior_ruleset

    - name: Ask analysisd whether it still accepts that ruleset
      ansible.builtin.command: /var/ossec/bin/wazuh-analysisd -t
      register: puc2_prior_t
      changed_when: false
      failed_when: false
      when: puc2_prior_ruleset.stat.exists

    - name: Remove a ruleset analysisd refuses, so the manager can start
      ansible.builtin.file:
        path: /var/ossec/ruleset/rules/9999-puc2-2c.xml
        state: absent
      when:
        - puc2_prior_ruleset.stat.exists
        - puc2_prior_t.rc | default(0) != 0
          or 'ERROR' in (puc2_prior_t.stdout | default(''))
          or 'CRITICAL' in (puc2_prior_t.stdout | default(''))
          or 'ERROR' in (puc2_prior_t.stderr | default(''))
          or 'CRITICAL' in (puc2_prior_t.stderr | default(''))
  roles:
    - ng-siem

# The `kali` NODE stays: its address is the scenario's C2 (puc2_c2_ip derives
# from it) and it is the candidate analyst workstation for the dashboards. Its
# ROLE is gone — it installed Caldera and offensive tooling, and the PUC2 2c UML
# has no attacker host at all; the Cyber Range performs the injection directly
# on the endpoint. The node still gets the `all` role and sandbox-logging, which
# is where its rsyslog fix lives.

- name: Configuring victim PC
  hosts: victim
  become: yes
  roles:
    - victim

- name: Configure to all systems (logging, hosts, etc)
  hosts: all
  become: true
  roles:
    - all

# The `man` node and its syslog-ng role are removed entirely: neither appears in
# the PUC2 2c UML. The node is gone from topology.yml too, so this play would
# have no hosts to run against.

- name: set up command logging
  hosts:
    - routers
    - hosts
  become: yes
  roles:
    - role: sandbox-logging
      slf_destination_port: '{% if hostvars["man"] is defined -%} 514 {%- else -%} 515 {%- endif %}'
      when: ansible_system == "Linux"

# =============================================================================
# PUC2 (CYNET) — Sub Case 2c overlay
# -----------------------------------------------------------------------------
# Everything above this line is the ng-soc-ansible@integrations substrate,
# copied verbatim. Everything below is the ADDITIVE scenario overlay: it never
# modifies a substrate role and it always runs AFTER them, so the MISP /
# custom-iris integrations injected into ossec.conf by the ng-siem role are
# already in place (the overlay uses distinct blockinfile markers).
#
# Ordering contract:
#   docker-server (facts: misp_api_key, iris_api_key, docker_server_internal_ip)
#   -> ng-siem (integrations)  -> ng_siem_rules_2c  -> lab_endpoint_2c
#   -> cti_ss_2c / cicms_2c / soar_actions_2c       -> evaluation_reporting
#
# group_vars/puc2_2c.yml is loaded explicitly: the topology declares
# `groups: []`, so a group_vars file would never be auto-loaded. vault.yml is
# git-ignored, so the example file is used when it is absent.
# =============================================================================

- name: PUC2 2c — NG-SIEM detection rules and active-response wiring (steps 3-6, 9-10)
  hosts: ng-siem
  become: true
  gather_facts: true
  vars_files:
    - group_vars/puc2_2c.yml
    - "{{ lookup('first_found', ['group_vars/vault.yml', 'group_vars/vault.yml.example']) }}"
  roles:
    - ng_siem_rules_2c

- name: PUC2 2c — endpoint FIM, containment action and scenario staging (steps 1-3, 10, 11)
  hosts: victim
  become: true
  gather_facts: true
  vars_files:
    - group_vars/puc2_2c.yml
    - "{{ lookup('first_found', ['group_vars/vault.yml', 'group_vars/vault.yml.example']) }}"
  roles:
    - lab_endpoint_2c
    # The Cyber Range injects into the endpoint (UML steps 1-2). Provisioning
    # only STAGES it; the attack itself is tagged `never` and fires only with
    # --tags puc2-inject. Ordered after lab_endpoint_2c so FIM and the active
    # response already exist when the payload lands.
    - scenario_injection_2c

- name: PUC2 2c — CTI-SS seeding, CICMS template, NG-SOAR action library (steps 4, 7, 8, 12)
  hosts: docker-server
  become: true
  gather_facts: true
  vars_files:
    - group_vars/puc2_2c.yml
    - "{{ lookup('first_found', ['group_vars/vault.yml', 'group_vars/vault.yml.example']) }}"
  roles:
    - cti_ss_2c
    - cicms_2c
    - soar_actions_2c
    - puc2_credentials

- name: PUC2 2c — evaluation and reporting collateral (step 13)
  hosts: ng-siem
  become: true
  gather_facts: true
  vars_files:
    - group_vars/puc2_2c.yml
    - "{{ lookup('first_found', ['group_vars/vault.yml', 'group_vars/vault.yml.example']) }}"
  roles:
    - evaluation_reporting

# =============================================================================
# Rehearsal — OPT-IN, NEVER part of a build (tagged `never`), placed right
# before the preflight gate so a single command can fire, verify, self-clean,
# and then re-prove the gate green:
#
#   ansible-playbook provisioning/playbook.yml \
#     --tags puc2_rehearsal,puc2-preflight -e puc2_rehearsal_enabled=true \
#     --limit ng-siem,victim,docker-server
#
# Unlike the preflight gate (which only ARMS the scenario), this fires the real
# attack and watches the whole chain 100101 -> 100102 -> 100103 -> active
# response -> markers -> quarantine in runtime, then removes every trace so the
# range is handed to the student exactly as provisioning left it. No
# any_errors_fatal: a broken link must still reach the always-cleanup.
# =============================================================================
- name: PUC2 2c — rehearsal, fire the chain end to end then self-clean
  hosts: ng-siem,victim,docker-server
  become: true
  gather_facts: true
  vars_files:
    - group_vars/puc2_2c.yml
    - "{{ lookup('first_found', ['group_vars/vault.yml', 'group_vars/vault.yml.example']) }}"
  roles:
    - role: puc2_rehearsal
      tags: [puc2_rehearsal, puc2-rehearsal, never]

# =============================================================================
# QA gate — runs last, fails the deployment if the range cannot answer its own
# training. Read-only: it arms the scenario (the script's read-only mode) and
# reads back the live services; it never fires the attack.
#
#   ansible-playbook provisioning/playbook.yml --tags puc2-preflight
#
# to re-run just the gate against an already-provisioned sandbox.
# =============================================================================
- name: PUC2 2c — preflight, every graded training answer must be obtainable
  hosts: ng-siem,victim,docker-server
  become: true
  gather_facts: true
  any_errors_fatal: true
  vars_files:
    - group_vars/puc2_2c.yml
    - "{{ lookup('first_found', ['group_vars/vault.yml', 'group_vars/vault.yml.example']) }}"
  roles:
    - role: puc2_preflight
      tags: [puc2-preflight]

# =============================================================================
# Diagnostics — read-only, opt-in, NEVER part of a build (tagged `never`).
#
#   ansible-playbook provisioning/playbook.yml --tags puc2_diag --limit docker-server
#
# Asks CTI-SS and CICMS directly whether the scenario content is there, and
# writes diagnostics/DIAGNOSIS.md with the HTTP status and the API's own words
# for each resource. Creates nothing; cannot fail a build.
# =============================================================================
- name: PUC2 2c — diagnose the CTI-SS / CICMS content against the live APIs
  hosts: docker-server
  become: true
  gather_facts: true
  vars_files:
    - group_vars/puc2_2c.yml
    - "{{ lookup('first_found', ['group_vars/vault.yml', 'group_vars/vault.yml.example']) }}"
  roles:
    - role: puc2_diag
      tags: [puc2_diag, puc2-diag, never]

# =============================================================================
# Access probe — read-only, opt-in, NEVER part of a build (tagged `never`).
#
#   ansible-playbook provisioning/playbook.yml \
#     --tags puc2_access_probe -e puc2_access_probe_enabled=true
#
# Reports, per node, whether a browser and desktop are present and which SOC
# dashboards it can reach, and writes diagnostics/ACCESS-PROBE-RESULTS.md. Fills
# the "CONFIRM IN SANDBOX" cells of ACCESS-MATRIX.md with live data. Installs
# nothing; cannot fail a build.
# =============================================================================
- name: PUC2 2c — probe each node for desktop, browser and dashboard reachability
  hosts: all
  become: true
  gather_facts: true
  vars_files:
    - group_vars/puc2_2c.yml
    - "{{ lookup('first_found', ['group_vars/vault.yml', 'group_vars/vault.yml.example']) }}"
  roles:
    - role: puc2_access_probe
      tags: [puc2_access_probe, puc2-access-probe, never]


# --- Change man syslog-ng and adding Command Logging
- name: Changing syslog-ng on man
  hosts: man
  become: yes
  roles:
    - man

- name: set up command logging
  hosts: 
    - routers
    - hosts
  roles:
    - role: sandbox-logging
      become: yes
      slf_destination_port: '{% if hostvars["man"] is defined -%} 514 {%- else -%} 515 {%- endif %}'
      when: ansible_system == "Linux"
