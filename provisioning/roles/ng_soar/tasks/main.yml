---
# =============================================================================
# role: ng_soar  (automated response engine)
# Covers UML steps:
#   9  - SOC Analyst triggers containment playbooks
#   10 - NG-SOAR applies isolation + remediation to Lab Hosts/Endpoints
#   11 - NG-SOAR reports containment & eradication status
# Deploys the executable containment playbooks onto the SOC host. NG-SOAR
# (Shuffle) runs them as workflow actions; they are also runnable standalone.
# =============================================================================

- name: Create NG-SOAR playbook directory
  ansible.builtin.file:
    path: "{{ ngsoar_playbook_dir }}"
    state: directory
    mode: "0755"

- name: Deploy containment playbooks
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ngsoar_playbook_dir }}/{{ item }}"
    mode: "0750"
  loop:
    - isolate_host.yml
    - block_malicious_ip.yml
    - reset_credentials.yml
    - quarantine_and_patch.yml

- name: Render NG-SOAR target inventory (endpoints to act on)
  ansible.builtin.template:
    src: soar_targets.ini.j2
    dest: "{{ ngsoar_playbook_dir }}/targets.ini"
    mode: "0640"

- name: Render NG-SOAR containment runner
  ansible.builtin.template:
    src: run_containment.sh.j2
    dest: "{{ ngsoar_playbook_dir }}/run_containment.sh"
    mode: "0750"
