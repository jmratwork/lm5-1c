---
# 2. FILE SYSTEM & DIRECTORY FIXES (The "Wazuh-Indexer" fix)
- name: Create missing Wazuh Indexer log directory
  file:
    path: /var/log/wazuh-indexer
    state: directory
    owner: wazuh-indexer
    group: wazuh-indexer
    mode: '0755'

# 3. NETWORKING & HOST RESOLUTION (The "Loopback" fix)
- name: Configure internal routing in /etc/hosts
  block:
    - name: Restore standard localhost entry
      lineinfile:
        path: /etc/hosts
        regexp: '^127.0.0.1'
        line: "127.0.0.1 localhost"

- name: Map SIEM FQDNs to Internal Pentest IP (ens4)
  lineinfile:
    path: /etc/hosts
    # This regex ensures we replace ANY existing entry for the domain
    regexp: '.*{{ item }}$'
    # Use ens4 specifically to avoid the 192.168.x.x management IP
    line: "{{ ansible_ens4.ipv4.address }} {{ item }}"
    state: present
  loop:
    - wazuh-indexer.mini.ngsiem.sph.gr
    - wazuh-manager.mini.ngsiem.sph.gr
    - wazuh-dashboard.mini.ngsiem.sph.gr
    - fluentd.mini.ngsiem.sph.gr
    - keycloak.mini.ngsiem.sph.gr
    - postgres.keycloak.mini.ngsiem.sph.gr
    - misp.mini.ngsiem.sph.gr
    - mariadb.misp.mini.ngsiem.sph.gr
    - redis.misp.mini.ngsiem.sph.gr
    - modules.misp.mini.ngsiem.sph.gr
    - zookeeper.mini.ngsiem.sph.gr
    - kafka.mini.ngsiem.sph.gr
    - ui.kafka.mini.ngsiem.sph.gr
    - navigator.mini.ngsiem.sph.gr
    - db.backend.mini.ngsiem.sph.gr
    - cache.backend.mini.ngsiem.sph.gr
    - backend.mini.ngsiem.sph.gr
    - guacamole.mini.ngsiem.sph.gr
    - iframe.mini.ngsiem.sph.gr
    - app.mini.ngsiem.sph.gr

- name: Restart Docker to apply new networking
  systemd:
    name: docker
    state: restarted

# 4. SERVICE RECOVERY
- name: Ensure Wazuh Indexer and Docker are restarted
  systemd:
    name: "{{ item }}"
    state: restarted
    enabled: yes
  loop:
    - wazuh-indexer
    - wazuh-manager
    - docker
  ignore_errors: true

- name: Wait for Wazuh Indexer API to be ready (Port 9200)
  wait_for:
    port: 9200
    delay: 10
    timeout: 300

- name: Run Wazuh Dashboard Init (Imports Patterns)
  shell: "docker start wazuh-dashboard-init"
  register: init_result
  failed_when: false # It's okay if this is already finished
  changed_when: "init_result.rc == 0"

- name: Start Pandora UI Container
  docker_container:
    name: ui
    state: started
  register: ui_status

- name: Start SIEM Backend Engine
  docker_container:
    name: backend
    state: started
  register: backend_status

- name: Start Alerts Correlator
  docker_container:
    name: alerts-correlator
    state: started
  register: correlator_status

- name: Ensure Native Wazuh Dashboard Service is Running
  systemd:
    name: wazuh-dashboard
    state: started
    enabled: yes
  register: native_dash_status

- name: Save ng-siem internal (topology) IP fact
  ansible.builtin.set_fact:
    ng_siem_internal_ip: "{{ ansible_all_ipv4_addresses | select('match', '^10\\.') | first }}"
    cacheable: yes

## API Key Integrations ───────────────────────────────────────────────────────────────────
# ── Verify facts arrived from docker-server role ──────────────────────────────
- name: Assert MISP API key was passed from docker-server role
  ansible.builtin.assert:
    that:
      - hostvars['docker-server']['misp_api_key'] is defined
      - hostvars['docker-server']['misp_api_key'] | trim != ''
    fail_msg: >
      misp_api_key is not set in hostvars['docker-server'].
      Ensure the docker-server role ran first AND set cacheable: yes on the fact.
      Also confirm your inventory hostname for that host is exactly 'docker-server'.

- name: Assert DFIR-IRIS API key was passed from docker-server role
  ansible.builtin.assert:
    that:
      - hostvars['docker-server']['iris_api_key'] is defined
      - hostvars['docker-server']['iris_api_key'] | trim != ''
    fail_msg: >
      iris_api_key is not set in hostvars['docker-server'].
      Same checklist as above.

- name: Assert docker-server internal IP was passed from docker-server role
  ansible.builtin.assert:
    that:
      - hostvars['docker-server']['docker_server_internal_ip'] is defined
      - hostvars['docker-server']['docker_server_internal_ip'] | trim != ''
    fail_msg: >
      docker_server_internal_ip is not set in hostvars['docker-server'].
      Ensure the docker-server role ran first and set cacheable: yes on the fact.

# ── Fix quoted values in pre-existing integration blocks ──────────────────────
- name: Fix quoted XML values in pre-existing integrations
  ansible.builtin.shell: |
    sed -i 's|>"\(.*\)"<|>\1<|g' /var/ossec/etc/ossec.conf
    echo "done"
  changed_when: true

# ── Remove stale pre-existing IRIS integration block (not Ansible-managed) ────
- name: Remove stale custom-wazuh_iris integration block if present
  ansible.builtin.shell: |
    python3 - << 'PYEOF'
    import re
    with open('/var/ossec/etc/ossec.conf', 'r') as f:
        content = f.read()
    cleaned = re.sub(
        r'\s*<!--\s*IRIS integration\s*-->\s*<integration>.*?</integration>',
        '', content, flags=re.DOTALL
    )
    if cleaned != content:
        with open('/var/ossec/etc/ossec.conf', 'w') as f:
            f.write(cleaned)
        print('removed')
    else:
        print('not_found')
    PYEOF
  register: stale_block_removal
  changed_when: "'removed' in stale_block_removal.stdout"

# ── Remove any previous ANSIBLE MANAGED integration block ─────────────────────
- name: Remove any previous ANSIBLE MANAGED integration block
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    marker: "<!-- {mark} ANSIBLE MANAGED CYBERRANGE INTEGRATIONS -->"
    state: absent

# ── Strip stray content after last </ossec_config> ────────────────────────────
- name: Strip any stray content after last closing tag
  ansible.builtin.shell: |
    python3 << 'EOF'
    with open('/var/ossec/etc/ossec.conf', 'r') as f:
        content = f.read()
    tag = '</ossec_config>'
    last_idx = content.rfind(tag)
    if last_idx == -1:
        print("ERROR: no closing tag found!")
    else:
        trimmed = content[:last_idx + len(tag)].rstrip() + '\n'
        with open('/var/ossec/etc/ossec.conf', 'w') as f:
            f.write(trimmed)
        print(f"Trimmed OK. Closing tags in result: {trimmed.count(tag)}")
    EOF
  changed_when: true

# ── Deploy custom-iris integration script ─────────────────────────────────────
- name: Ensure Wazuh integrations directory exists
  ansible.builtin.file:
    path: /var/ossec/integrations
    state: directory
    owner: root
    group: wazuh
    mode: '0750'

- name: Deploy custom-iris integration script
  ansible.builtin.copy:
    dest: /var/ossec/integrations/custom-iris
    owner: root
    group: wazuh
    mode: '0750'
    content: |
      #!/usr/bin/env python3
      import sys, json, requests, urllib3, hashlib
      from datetime import datetime, timezone
      urllib3.disable_warnings(urllib3.exceptions.InsecureRequestWarning)

      alert_file, api_key, hook_url = sys.argv[1], sys.argv[2], sys.argv[3]
      
      with open(alert_file) as f:
          alert = json.load(f)
      
      rule = alert.get("rule", {})
      rule_id = str(rule.get("id", ""))
      agent = alert.get("agent", {})
      data = alert.get("data", {})
      
      # 1. DYNAMIC CASE DEDUPLICATION LOGIC
      # Extract identifiers to create a unique fingerprint (e.g., source IP, file hash, or user)
      source_ip = data.get("srcip", "unknown-ip")
      dst_user = data.get("dstuser", "unknown-user")
      sha256 = data.get("misp", {}).get("source", {}).get("sha256", "no-hash")
      
      # Create a unique tracking identifier
      case_soc_id = f"WAZUH-{rule_id}-{source_ip}-{dst_user}-{sha256}"
      base_url = "/".join(hook_url.split("/")[:3]) # Automatically extracts https://<IP>:<PORT>
      
      # Check IRIS to ensure we aren't creating a duplicate case
      try:
          check_r = requests.get(f"{base_url}/manage/cases/list", headers={"Authorization": f"Bearer {api_key}"}, verify=False, timeout=10)
          if check_r.status_code == 200:
              existing_cases = check_r.json().get("data", [])
              if any(c.get("case_soc_id") == case_soc_id for c in existing_cases):
                  sys.exit(0) # Silent exit! Case already being investigated.
      except Exception:
          pass # Fallback to creation if list fails

      # 2. SEVERITY MAPPING LOGIC
      level = int(rule.get("level", 0))
      severity_id = 5 if level >= 12 else (4 if level >= 10 else (3 if level >= 7 else 2))

      # 3. ADVANCED MITRE TAGGING
      mitre = rule.get("mitre", {})
      case_tags = ["wazuh", f"rule-{rule_id}"]
      case_tags.extend(mitre.get("id", []))
      case_tags.extend([t.replace(" ", "-").lower() for t in mitre.get("tactic", [])])

      # Send directly to the advanced Case creation endpoint instead of basic alerts
      case_url = f"{base_url}/manage/cases/add"
      payload = {
          "case_soc_id": case_soc_id,
          "case_customer": 1,
          "case_name": f"[{rule_id}] {rule.get('description', 'Wazuh Alert')} on {agent.get('name', 'Agent')}",
          "case_description": f"Rule Level: {level}\nAgent IP: {agent.get('ip', 'N/A')}\n\nFull JSON:\n{json.dumps(alert, indent=2)}",
          "severity_id": str(severity_id),
          "case_tags": ",".join(case_tags)
      }

      headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}
      try:
          r = requests.post(case_url, json=payload, headers=headers, verify=False, timeout=10)
          r.raise_for_status()
      except requests.exceptions.RequestException as e:
          print(f"ERROR: {e}", file=sys.stderr)
          sys.exit(1)
      sys.exit(0)

- name: Remove any pre-existing custom-iris.py file (replaced by symlink)
  ansible.builtin.file:
    path: /var/ossec/integrations/custom-iris.py
    state: absent

- name: Create custom-iris.py symlink for Wazuh integratord
  ansible.builtin.file:
    src: /var/ossec/integrations/custom-iris
    dest: /var/ossec/integrations/custom-iris.py
    state: link

# ── Inject integration block ──────────────────────────────────────────────────
- name: Inject MISP and DFIR-IRIS integrations into ossec.conf
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    insertbefore: "</ossec_config>"
    marker: "<!-- {mark} ANSIBLE MANAGED CYBERRANGE INTEGRATIONS -->"
    block: |
      <!-- Integration with CTI-SS (MISP) -->
      <integration>
        <name>misp</name>
        <api_key>{{ hostvars['docker-server']['misp_api_key'] }}</api_key>
        <hook_url>https://{{ hostvars['docker-server']['docker_server_internal_ip'] }}:8443</hook_url>
        <alert_format>json</alert_format>
      </integration>

      <!-- Integration with CICMS (DFIR-IRIS) -->
      <integration>
        <name>custom-iris</name>
        <hook_url>https://{{ hostvars['docker-server']['docker_server_internal_ip'] }}:8083/alerts/add</hook_url>
        <api_key>{{ hostvars['docker-server']['iris_api_key'] }}</api_key>
        <level>7</level>
        <alert_format>json</alert_format>
      </integration>

# ── Validate and apply ────────────────────────────────────────────────────────
- name: Validate ossec.conf after integration injection
  ansible.builtin.shell: |
    result=$(/var/ossec/bin/verify-agent-conf 2>&1)
    if echo "$result" | grep -qi "error\|critical"; then
      echo "CONF_ERROR: $result"
    else
      echo "CONF_OK"
    fi
  args:
    chdir: /var/ossec
  register: ossec_xml_final
  changed_when: false

- name: FAIL if ossec.conf has errors after injection
  ansible.builtin.fail:
    msg: "ossec.conf failed after injection: {{ ossec_xml_final.stdout }}"
  when: "'CONF_ERROR' in ossec_xml_final.stdout"

- name: Fix ossec.conf permissions after Python write
  ansible.builtin.file:
    path: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: '0660'

# ── Restart and verify wazuh-manager ─────────────────────────────────────────

- name: Restart wazuh-manager
  ansible.builtin.service:
    name: wazuh-manager
    state: restarted

- name: Wait for wazuh-manager to be active
  ansible.builtin.shell: systemctl is-active wazuh-manager
  register: wazuh_status
  until: wazuh_status.stdout == "active"
  retries: 12
  delay: 5
  changed_when: false

