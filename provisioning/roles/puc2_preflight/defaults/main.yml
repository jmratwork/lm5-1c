---
# role: puc2_preflight
# Fallbacks only. The authoritative values live in group_vars/puc2_2c.yml.
puc2_arm_token: "puc2-2c-armed"
puc2_payload_md5: "44d88612fea8a8f36de82e1278abb02f"
puc2_payload_name: "invoice.exe"
puc2_injection_root: "/opt/puc2"
puc2_active_response_rules: "100103"
puc2_admin_ssh_port: 22
puc2_c2_domain: "c2.puc2-training.lab"
puc2_case_soc_id: "CASE-PUC2-2C"
puc2_misp_sharing_group_name: "NG-SOC-PUC2"
puc2_mitre_initial_access: "T1566.001"
puc2_mitre_execution: "T1204.002"
puc2_soar_playbook_dir: "/opt/NG-SOAR/playbooks"
puc2_isolation_marker: "/var/run/ngsoar_isolated"
puc2_eradication_marker: "/var/run/ngsoar_eradication_status"
puc2_expected_c2_ip: "10.0.16.50"
puc2_expected_victim_ip: "10.0.16.100"
puc2_expected_ng_siem_ip: "10.0.16.70"
puc2_expected_docker_server_ip: "10.0.16.60"
puc2_misp_seed_dir: "/opt/cti-ss-seed"
puc2_eval_root: "/opt/evaluation"
puc2_soar_webhook_port: 8080
puc2_victim_mail_spool: "/var/mail/victim"
puc2_c2_port: 4444
puc2_fw_log_prefix: "PUC2-FW-DROP"
puc2_logtest_probe_line: >-
  Jul 22 08:24:29 victim kernel: [12345.678901] {{ puc2_fw_log_prefix }}: IN= OUT=ens4
  SRC={{ puc2_expected_victim_ip }} DST={{ puc2_expected_c2_ip }} LEN=60 TOS=0x00
  PREC=0x00 TTL=64 ID=1 DF PROTO=TCP SPT=54321 DPT={{ puc2_c2_port }} WINDOW=64240
  RES=0x00 SYN URGP=0

# ---- Analyst workstation (kali) --------------------------------------------
# The four dashboards exactly as the training's access primer prints them. They
# are checked by host:port rather than by URL: the gate is asking whether a
# trainee's browser can get there at all, and the services answer with different
# HTTP statuses depending on session state. Deliberately the `puc2_expected_*`
# literals, not the resolved facts — these are the addresses the LEVEL TEXT
# hardcodes, so they are what has to be reachable.
puc2_pf_dashboards:
  - name: "NG-SIEM (Wazuh) https://{{ puc2_expected_ng_siem_ip }}"
    host: "{{ puc2_expected_ng_siem_ip }}"
    port: 443
  - name: "CTI-SS (MISP) https://{{ puc2_expected_docker_server_ip }}:8443"
    host: "{{ puc2_expected_docker_server_ip }}"
    port: 8443
  - name: "CICMS (DFIR-IRIS) https://{{ puc2_expected_docker_server_ip }}:8083"
    host: "{{ puc2_expected_docker_server_ip }}"
    port: 8083
  - name: "NG-SOAR http://{{ puc2_expected_docker_server_ip }}:8080"
    host: "{{ puc2_expected_docker_server_ip }}"
    port: "{{ puc2_soar_webhook_port }}"

# Generous: these run right after the containers came up, and a dashboard that
# needs a few seconds more is not a dashboard a trainee cannot reach.
puc2_pf_dashboard_timeout: 30

# Browser executables that would satisfy "use its browser" in level 1.
puc2_pf_browsers:
  - firefox
  - firefox-esr
  - chromium
  - chromium-browser
  - google-chrome
  - epiphany
