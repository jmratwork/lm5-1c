---
# CTI-SS / CICMS / NG-SOAR side of the gate. These are the four answers the QA
# report could only mark "created via API, high confidence, close off with a
# glance at the dashboard" — L9, L14, L15, L24 (plus L26). Here they are read
# back from the live services, so the glance is no longer anyone's homework.

- name: Read back the PUC2 2c event from CTI-SS
  ansible.builtin.uri:
    url: "{{ puc2_misp_url }}/events/restSearch"
    method: POST
    headers:
      Authorization: "{{ puc2_misp_api_key }}"
      Accept: "application/json"
      Content-Type: "application/json"
    body_format: json
    body:
      value: "{{ puc2_payload_md5 }}"
      returnFormat: "json"
    validate_certs: false
    status_code: [200, 404]
    timeout: 30
  register: puc2_pf_misp_event
  no_log: true
  failed_when: false

- name: Read back the CTI-SS sharing groups
  ansible.builtin.uri:
    url: "{{ puc2_misp_url }}/sharing_groups/index"
    method: GET
    headers:
      Authorization: "{{ puc2_misp_api_key }}"
      Accept: "application/json"
    validate_certs: false
    status_code: [200, 404]
    timeout: 30
  register: puc2_pf_misp_groups
  no_log: true
  failed_when: false

- name: Read back the case list from CICMS
  ansible.builtin.uri:
    url: "{{ puc2_iris_url }}/manage/cases/list"
    method: GET
    headers:
      Authorization: "Bearer {{ puc2_iris_api_key }}"
      Content-Type: "application/json"
    validate_certs: false
    status_code: [200, 401, 403, 404]
    timeout: 30
  register: puc2_pf_iris_cases
  no_log: true
  failed_when: false

- name: List the NG-SOAR containment library
  ansible.builtin.find:
    paths: "{{ puc2_soar_playbook_dir }}"
    patterns: "*.yml"
  register: puc2_pf_soar

- name: Collect the service responses as plain text
  ansible.builtin.set_fact:
    puc2_pf_event: "{{ puc2_pf_misp_event.content | default('') | string }}"
    puc2_pf_groups: "{{ puc2_pf_misp_groups.content | default('') | string }}"
    puc2_pf_cases: "{{ puc2_pf_iris_cases.content | default('') | string }}"
    puc2_pf_books: "{{ puc2_pf_soar.files | default([]) | map(attribute='path') | map('basename') | list }}"
  no_log: true

- name: GATE — CTI-SS, CICMS and the NG-SOAR library answer their levels
  ansible.builtin.assert:
    that:
      # L9 and L26: the ATT&CK techniques the trainee reads off the event
      - puc2_mitre_initial_access in puc2_pf_event
      - puc2_mitre_execution in puc2_pf_event
      # L15: the C2 domain IOC pulled into the IRIS case
      - puc2_c2_domain in puc2_pf_event
      # L24: the sharing group published into
      - puc2_misp_sharing_group_name in puc2_pf_groups
      # L14: the scenario case SOC id
      - puc2_case_soc_id in puc2_pf_cases
      # L18: the playbook name read off the library listing
      - "'isolate_host.yml' in puc2_pf_books"
      - "'block_malicious_ip.yml' in puc2_pf_books"
      - "'reset_credentials.yml' in puc2_pf_books"
      - "'quarantine_and_patch.yml' in puc2_pf_books"
    fail_msg: >-
      CTI-SS / CICMS preflight FAILED — trainees would hit a blocking level.
      MISP event carries {{ puc2_mitre_initial_access }}:
      {{ puc2_mitre_initial_access in puc2_pf_event }};
      {{ puc2_mitre_execution }}: {{ puc2_mitre_execution in puc2_pf_event }};
      C2 IOC {{ puc2_c2_domain }}: {{ puc2_c2_domain in puc2_pf_event }};
      sharing group {{ puc2_misp_sharing_group_name }}:
      {{ puc2_misp_sharing_group_name in puc2_pf_groups }};
      IRIS case {{ puc2_case_soc_id }}: {{ puc2_case_soc_id in puc2_pf_cases }};
      NG-SOAR library: {{ puc2_pf_books }}.
      A false here usually means the API call was rejected — check the keys
      published by the docker_server role. Re-run:
      ansible-playbook provisioning/playbook.yml --limit docker-server
    success_msg: >-
      CTI-SS OK — event carries {{ puc2_mitre_initial_access }},
      {{ puc2_mitre_execution }} and {{ puc2_c2_domain }}; sharing group
      {{ puc2_misp_sharing_group_name }} present. CICMS OK — case
      {{ puc2_case_soc_id }} present. NG-SOAR library: {{ puc2_pf_books | length }}
      playbooks.
