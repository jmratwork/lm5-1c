---
# NG-SOAR containment playbook: reset potentially compromised credentials.
# UML step 10 ("reset credentials"). Expires passwords and revokes active
# sessions for the affected local users; new password is supplied at runtime
# from the SOAR vault (never hardcoded here).
- name: Reset compromised credentials
  hosts: "{{ target | default('all') }}"
  become: true
  vars:
    affected_users:
      - victim
    new_password_hash: ""        # injected by NG-SOAR from vault
  tasks:
    - name: Expire affected user passwords (force reset at next login)
      ansible.builtin.user:
        name: "{{ item }}"
        password_expire_max: 0
      loop: "{{ affected_users }}"

    - name: Set new password hash when provided
      ansible.builtin.user:
        name: "{{ item }}"
        password: "{{ new_password_hash }}"
      loop: "{{ affected_users }}"
      when: new_password_hash | length > 0
      no_log: true

    - name: Kill active sessions of affected users
      ansible.builtin.command: "pkill -KILL -u {{ item }}"
      loop: "{{ affected_users }}"
      register: pkill_result
      changed_when: pkill_result.rc == 0
      failed_when: pkill_result.rc not in [0, 1]
