---
# =============================================================================
# role: ng_siem_rules_2c        (host: ng-siem — runs AFTER the ng-siem role)
#
# ADDITIVE OVERLAY on top of the siemng image configured by the integrations
# substrate. It does NOT redeploy Wazuh and it does NOT touch the substrate's
# MISP / custom-iris integration block: that block owns the marker
#   <!-- ... ANSIBLE MANAGED CYBERRANGE INTEGRATIONS -->
# while everything here lives under a DISTINCT marker
#   <!-- ... ANSIBLE MANAGED PUC2-2C DETECTION AND RESPONSE -->
#
# UML coverage:
#   step 3  - telemetry (file hash) correlated by rule 100100
#   step 4  - CTI hash watchlist (CDB list) feeding rule 100101
#   step 5  - "malware detected" alert (rule 100101, level 12)
#   step 6  - correlated targeted-attack confirmation (rule 100103, level 14)
#   step 9/10 - rule 100103 launches the puc2-isolate active response on the
#               originating agent (location=local). Only the correlated rule
#               triggers it, so containment follows confirmation instead of
#               interrupting the delivery — see group_vars/puc2_2c.yml.
# =============================================================================

- name: Assert the substrate ng-siem role already ran on this host
  ansible.builtin.stat:
    path: /var/ossec/etc/ossec.conf
  register: puc2_ossec_conf
  failed_when: not puc2_ossec_conf.stat.exists

# ── Firewall decoder: removed, it could never run (UML step 6) ───────────────
# puc2_local_decoder.xml declared a prematch and no <program_name>. analysisd
# keeps decoders in two lists, one for those declaring a program_name and one
# for those that do not, and an event that carries a program_name is only ever
# matched against the first — so this decoder sat in a list the endpoint's
# kernel lines never consulted. wazuh-logtest showed the built-in `kernel`
# decoder taking the line and populating srcip, dstip, srcport, dstport and
# protocol on its own; rule 100102 now keys on that instead. Ranges provisioned
# before this change still carry the file, so remove it rather than just
# stopping deploying it: an unreachable decoder left on disk reads like
# working detection to whoever looks next.
- name: Remove the unreachable PUC2 2c firewall decoder
  ansible.builtin.file:
    path: /var/ossec/etc/decoders/puc2_local_decoder.xml
    state: absent
  notify: restart wazuh-manager

# ── Detection rules (UML steps 3, 5, 6) ──────────────────────────────────────
# They go where this image demonstrably loads them, which is NOT etc/rules.
# PROOF, from deploying the identical file (md5 a13009d5) to each location:
# in etc/rules the manager started cleanly and the file had no effect at all,
# through five deployments and four ways of keying rule 100102; moved to
# ruleset/rules the manager refused to start, because the same file contains
# something analysisd rejects. Only a parsed file can break a startup.
#
# That also corrected an assumption this work leaned on for two rounds: Wazuh
# does NOT warn-and-ignore an if_sid naming a signature that does not exist. It
# treats it as fatal and refuses to start. The 7617/7619 warnings seen on every
# boot are the degraded path for rules whose PARENT failed to load, which is a
# different case.
#
# This is a deliberate deviation: Wazuh treats ruleset/rules as its own and a
# manager package upgrade can overwrite it. That is an acceptable trade for a
# pinned sandbox image and it is reversible the moment etc/rules is shown to
# work. The 9999- prefix keeps the file last in load order, so 4100 is defined
# before anything references it.
- name: Deploy PUC2 2c correlation rules
  ansible.builtin.template:
    src: local_rules.xml.j2
    dest: /var/ossec/ruleset/rules/9999-puc2-2c.xml
    owner: wazuh
    group: wazuh
    mode: '0660'
  notify: restart wazuh-manager

# The control probe has served its purpose and the copy of the real rules that
# preceded it is now in ruleset/rules. Leave neither behind: the probe carries a
# non-existent if_sid, which this image has just shown to be fatal, so it would
# be a landmine the day a Wazuh version starts honouring etc/rules.
- name: Remove the superseded etc/rules file
  ansible.builtin.file:
    path: /var/ossec/etc/rules/local_rules.xml
    state: absent
  notify: restart wazuh-manager

# ── CTI hash watchlist (UML step 4) ──────────────────────────────────────────
# CDB list keyed by MD5; rule 100101 does lookup="match_key" against it. The
# cti_ss_2c role seeds the very same IOCs into MISP so the SIEM enrichment and
# the analyst's CTI lookup agree.
- name: Ensure the Wazuh lists directory exists
  ansible.builtin.file:
    path: /var/ossec/etc/lists
    state: directory
    owner: wazuh
    group: wazuh
    mode: '0750'

- name: Deploy the CTI malware hash watchlist
  ansible.builtin.copy:
    dest: /var/ossec/etc/lists/cti-malware-hashes
    owner: wazuh
    group: wazuh
    mode: '0660'
    content: |
      {{ puc2_payload_md5 }}:puc2-2c-training-payload
      {{ puc2_payload_sha256 }}:puc2-2c-training-payload
  notify: restart wazuh-manager

# ── The stock CDB lists this image declares but does not ship ────────────────
# ossec.conf's default <ruleset> block declares etc/lists/audit-keys and
# etc/lists/amazon/*, and analysisd cannot find them. It does not shrug: it
# DISCARDS every rule that looks them up, and then every rule keyed on those —
#   WARNING: (7616): List 'etc/lists/audit-keys' could not be loaded. Rule '80780' will be ignored.
#   WARNING: (7617): Signature ID '80780' was not found ... rule '80781'
# — about thirty rules (80202-80255, 80780-80792) on every single boot, and the
# same thirty-three warning lines at the top of every wazuh-logtest run.
#
# No training level depends on those rules. The reason to fix it is that the
# preflight gate now reads exactly this class of message to decide whether
# analysisd discarded a PUC2 rule, and a wall of known-benign noise is where an
# unknown malignant line goes to hide.
#
# A placeholder entry rather than an empty file: a populated list is
# unambiguously compilable, and this image has already been caught being
# particular. `force: false` writes ONLY when the file is absent, so a real list
# — should a later image ship one — is never clobbered.
- name: Ensure the stock CDB lists the image declares actually exist
  ansible.builtin.file:
    path: /var/ossec/etc/lists/amazon
    state: directory
    owner: wazuh
    group: wazuh
    mode: '0750'

- name: Seed the missing stock CDB lists so their rules stop being discarded
  ansible.builtin.copy:
    dest: "/var/ossec/etc/lists/{{ item }}"
    force: false
    owner: wazuh
    group: wazuh
    mode: '0660'
    content: |
      puc2-placeholder:unused
  loop:
    - audit-keys
    - amazon/aws-sources
    - amazon/aws-eventnames
  notify: restart wazuh-manager

# ── Active response wiring (UML steps 9-10) ──────────────────────────────────
# Distinct marker: must never collide with the substrate's integration block.
- name: Register the PUC2 2c list, command and active response in ossec.conf
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    insertbefore: "</ossec_config>"
    marker: "<!-- {mark} ANSIBLE MANAGED PUC2-2C DETECTION AND RESPONSE -->"
    block: |
      <!-- CTI-SS hash watchlist consumed by rule 100101 (UML step 4) -->
      <ruleset>
        <list>etc/lists/cti-malware-hashes</list>
      </ruleset>

      <!-- Containment action executed on the affected endpoint (UML step 10) -->
      <command>
        <name>puc2-isolate</name>
        <executable>puc2-isolate</executable>
        <timeout_allowed>no</timeout_allowed>
      </command>

      <active-response>
        <command>puc2-isolate</command>
        <location>local</location>
        <rules_id>{{ puc2_active_response_rules }}</rules_id>
      </active-response>
  notify: restart wazuh-manager

# ── Validate and apply ───────────────────────────────────────────────────────
# NOTE ON WHAT THIS PROVES: `verify-agent-conf` validates the SHARED AGENT
# configuration (agent.conf) — not ossec.conf, and not the ruleset this role
# just wrote. It is kept because a broken agent.conf is worth catching here,
# but it must not be mistaken for a check that the rules load. That check is
# the ruleset test in the puc2_preflight gate, which asks analysisd directly.
- name: Validate the shared agent configuration after the PUC2 2c injection
  ansible.builtin.shell: |
    result=$(/var/ossec/bin/verify-agent-conf 2>&1)
    if echo "$result" | grep -qi "error\|critical"; then
      echo "CONF_ERROR: $result"
    else
      echo "CONF_OK"
    fi
  args:
    chdir: /var/ossec
  register: puc2_ossec_check
  changed_when: false

- name: FAIL if the PUC2 2c injection broke the agent configuration
  ansible.builtin.fail:
    msg: "agent.conf failed after the PUC2 2c injection: {{ puc2_ossec_check.stdout }}"
  when: "'CONF_ERROR' in puc2_ossec_check.stdout"

- name: Fix ossec.conf ownership after the injection
  ansible.builtin.file:
    path: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: '0660'

# ── Compile ──────────────────────────────────────────────────────────────────
# This used to run /var/ossec/bin/wazuh-makelists unconditionally with
# `failed_when: false`. That binary is NOT on this image: it returned rc 2, "No
# such file or directory", the task reported `ok`, and it compiled nothing —
# for the whole life of this role.
#
# What actually compiles the lists is analysisd itself, when it parses the
# ruleset. That is not a guess: in the 2026-09-10 build, cti-malware-hashes.cdb
# was written at 07:14:23.176, inside the 07:14:23.157-.334 window of the
# `wazuh-analysisd -t` run further down this file. The manager does the same on
# every start.
#
# So the tool is an implementation detail and this task only has to pick one
# that exists. The CRITERION is the artefact, asserted after the restart — a
# compile step that reports success while producing nothing is precisely the
# failure being corrected here.
- name: Compile the CDB lists with whichever tool this image ships
  ansible.builtin.shell: |
    set -u
    if [ -x /var/ossec/bin/wazuh-makelists ]; then
      /var/ossec/bin/wazuh-makelists
      echo "COMPILED_BY=wazuh-makelists rc=$?"
    elif [ -x /var/ossec/bin/wazuh-analysisd ]; then
      # Parsing the ruleset builds the lists as a side effect. rc is NOT judged
      # here: a ruleset analysisd refuses is caught, reverted and reported by
      # the validation block below, which owns that verdict.
      /var/ossec/bin/wazuh-analysisd -t >/dev/null 2>&1
      echo "COMPILED_BY=wazuh-analysisd-t rc=$?"
    else
      echo "COMPILED_BY=none"
    fi
  args:
    executable: /bin/bash
  register: puc2_makelists
  changed_when: "'COMPILED_BY=none' not in puc2_makelists.stdout"

- name: Show which tool compiled the lists
  ansible.builtin.debug:
    var: puc2_makelists.stdout_lines

# ── Never let a bad ruleset take the manager down ────────────────────────────
# A rule analysisd rejects is not a degraded rule: this deployment proved it
# stops wazuh-manager from starting at all, which does not cost one training
# level, it costs the host. Parse the ruleset BEFORE the restart handler runs,
# and if analysisd refuses it, pull the file back off disk and fail here with
# the reason. Aborting before flush_handlers means the restart never fires and
# the manager keeps running on the ruleset it already had.
#
# rc alone is not trusted as the verdict - this build's exit codes have already
# surprised this work once - so a fatal line in the output counts too. WARNING
# lines do not: this image emits dozens on every boot, from its own ruleset.
- name: Validate the ruleset before the restart handler can act on it
  block:
    - name: Ask analysisd to parse the ruleset exactly as deployed
      ansible.builtin.command: /var/ossec/bin/wazuh-analysisd -t
      register: puc2_ruleset_t
      changed_when: false
      failed_when:
        - puc2_ruleset_t.rc != 0
          or 'ERROR' in (puc2_ruleset_t.stdout | default(''))
          or 'CRITICAL' in (puc2_ruleset_t.stdout | default(''))
          or 'ERROR' in (puc2_ruleset_t.stderr | default(''))
          or 'CRITICAL' in (puc2_ruleset_t.stderr | default(''))
  rescue:
    - name: Take the rejected ruleset back off disk
      ansible.builtin.file:
        path: /var/ossec/ruleset/rules/9999-puc2-2c.xml
        state: absent

    # The placeholder stock lists seeded above are part of what analysisd just
    # parsed, so they are equally suspect and equally revertible. Removing them
    # returns the manager to exactly the config it came up on — noisy warnings
    # and all — which is a working manager. Only the files this role created can
    # be removed: `force: false` means a pre-existing list was never touched, and
    # a list with real content is not ours to delete.
    - name: Take the seeded placeholder lists back off disk
      ansible.builtin.shell: |
        for f in audit-keys amazon/aws-sources amazon/aws-eventnames; do
          p="/var/ossec/etc/lists/$f"
          if [ -f "$p" ] && grep -qx 'puc2-placeholder:unused' "$p" 2>/dev/null; then
            rm -f "$p" "$p.cdb"
            echo "reverted $p"
          fi
        done
      args:
        executable: /bin/bash
      register: puc2_lists_reverted
      changed_when: puc2_lists_reverted.stdout | length > 0
      failed_when: false

    # If analysisd rejects a rule, the shortest way to the right syntax is the
    # ruleset it already accepts. Show how the built-in FIM rules express the
    # same thing rather than guessing at the engine's regex dialect again.
    - name: Show how the accepted ruleset writes the same kind of rule
      ansible.builtin.shell: |
        echo "=== built-in rules keyed on syscheck 550/554 ==="
        grep -rh -B2 -A6 "if_sid>55[04]" /var/ossec/ruleset/rules/ | head -40
        echo "=== how the accepted ruleset uses field name=file ==="
        grep -rh 'name="file"' /var/ossec/ruleset/rules/ | head -10
        echo "=== does this build know type=pcre2 at all? ==="
        grep -rhc 'type="pcre2"' /var/ossec/ruleset/rules/ | paste -sd+ | bc
      args:
        executable: /bin/bash
      register: puc2_rule_idiom
      changed_when: false
      failed_when: false

    - name: Show the idiom
      ansible.builtin.debug:
        var: puc2_rule_idiom.stdout_lines

    - name: FAIL with what analysisd rejected
      ansible.builtin.fail:
        msg: >-
          analysisd REFUSED the PUC2 2c ruleset, so it was removed and
          wazuh-manager was left running on its previous ruleset. Fix the rule
          named below and redeploy; nothing restarted, so the range is intact
          apart from the missing detection. analysisd said:
          rc={{ puc2_ruleset_t.rc | default('not run') }}
          {{ puc2_ruleset_t.stdout | default('') }}
          {{ puc2_ruleset_t.stderr | default('') }}

- name: Apply the PUC2 2c ruleset now
  ansible.builtin.meta: flush_handlers

- name: Wait for wazuh-manager to be active again
  ansible.builtin.command: systemctl is-active wazuh-manager
  register: puc2_wazuh_status
  until: puc2_wazuh_status.stdout == "active"
  retries: 12
  delay: 5
  changed_when: false

# ── The compile step's actual criterion ──────────────────────────────────────
# Assert the ARTEFACT, not the exit code of whatever tool produced it. Rule
# 100101 reads the .cdb, never the plain list, so a .cdb that is missing, stale,
# or built before the hash was added is a rule that loads and never matches —
# L10 with no alert behind it, and no containment, from a role that reported
# every task green. That is exactly what `failed_when: false` on wazuh-makelists
# was hiding.
#
# The preflight gate checks this too. It belongs in both places: the gate reports
# that the range is broken, this reports WHICH ROLE broke it, at the moment it
# did.
- name: Stat the CTI watchlist and the .cdb rule 100101 actually reads
  ansible.builtin.stat:
    path: "{{ item }}"
  loop:
    - /var/ossec/etc/lists/cti-malware-hashes
    - /var/ossec/etc/lists/cti-malware-hashes.cdb
  register: puc2_cdb_stat

# grep -a: the .cdb is binary, and without it grep answers "Binary file matches"
# and exits 0 without ever having looked for the hash.
- name: Look for the payload hash inside the compiled CDB
  ansible.builtin.command:
    argv:
      - grep
      - -a
      - -c
      - -F
      - "{{ puc2_payload_md5 }}"
      - /var/ossec/etc/lists/cti-malware-hashes.cdb
  register: puc2_cdb_hash
  changed_when: false
  failed_when: false

- name: FAIL if the CTI watchlist did not compile into something rule 100101 can use
  ansible.builtin.assert:
    that:
      - puc2_cdb_stat.results[1].stat.exists
      - >-
        puc2_cdb_stat.results[1].stat.mtime | float
        >= puc2_cdb_stat.results[0].stat.mtime | float
      - puc2_cdb_hash.rc == 0
    fail_msg: >-
      The CTI hash watchlist did not compile. Rule 100101 looks up
      etc/lists/cti-malware-hashes.cdb, so training level L10 has no alert behind
      it and rule 100103 never correlates, so containment never fires either.
      Compiled .cdb exists: {{ puc2_cdb_stat.results[1].stat.exists }};
      newer than its source list:
      {{ (puc2_cdb_stat.results[1].stat.mtime | default(0) | float)
         >= (puc2_cdb_stat.results[0].stat.mtime | default(0) | float) }};
      carries {{ puc2_payload_md5 }}: {{ puc2_cdb_hash.rc == 0 }}.
      The compile step reported: {{ puc2_makelists.stdout | default('(not run)') }}.
      If it says COMPILED_BY=none, this image ships neither wazuh-makelists nor
      wazuh-analysisd and the compile has no tool to use at all.
    success_msg: >-
      CTI watchlist compiled — cti-malware-hashes.cdb is newer than its source
      and carries {{ puc2_payload_md5 }};
      {{ puc2_makelists.stdout | default('') | trim }}.

# ── Prove the ruleset actually loaded ────────────────────────────────────────
# Context for the probe below, gathered BEFORE it so a failure is diagnosable
# from the deployment log alone. Two very different faults produce the same
# "100102 did not come back": local_rules.xml is not loaded at all, or it is
# loaded and the rule sits somewhere the event never reaches. Nothing collected
# so far can tell them apart, which is why this block exists — it is evidence,
# never a verdict; the assert stays with the live probe.
- name: Collect the ruleset wiring analysisd is running with
  ansible.builtin.shell: |
    # ossec.log carries non-UTF-8 bytes, so grep classifies it as BINARY and
    # answers "Binary file /var/ossec/logs/ossec.log matches" INSTEAD of the
    # matching lines. Every grep below therefore needs -a. Without it the
    # 2026-09-10 build printed a bare "Binary file ... matches" where the rule
    # counts should have been, and the startup section fell back to lines dated
    # 2026-02-21 — the image's build date, not this deployment's.
    #
    # TODAY is also why the startup section is date-scoped: ossec.log is never
    # rotated on this image, so an unscoped `tail` reads whatever the image was
    # doing months ago and presents it as the state of this run.
    TODAY="$(date '+%Y/%m/%d')"
    echo "=== <ruleset> block in ossec.conf ==="
    sed -n '/<ruleset>/,/<\/ruleset>/p' /var/ossec/etc/ossec.conf
    echo "=== rule counts analysisd reported at startup (today only) ==="
    grep -a -iE "rules enabled|decoders enabled|lists enabled" \
      /var/ossec/logs/ossec.log | grep -a -F "$TODAY" | tail -5
    echo "=== anything analysisd said about the PUC2 ruleset (today only) ==="
    grep -a -iE "local_rules|9999-puc2|etc/rules" \
      /var/ossec/logs/ossec.log | grep -a -F "$TODAY" | tail -5
    echo "=== what is actually deployed ==="
    # etc/rules/ is listed because the role empties it deliberately: the rules
    # live in ruleset/rules on this image. local_rules.xml is NOT read back —
    # "Remove the superseded etc/rules file" above deletes it, so the old
    # readability check could only ever print "No such file or directory" and
    # read as a fault.
    ls -la /var/ossec/etc/rules/ /var/ossec/ruleset/rules/9999-puc2-2c.xml
    echo "=== can the wazuh user read the deployed ruleset ==="
    sudo -u wazuh head -1 /var/ossec/ruleset/rules/9999-puc2-2c.xml 2>&1 | head -2
    # THE CONTROLLED PAIR. Run the ruleset self-test FIRST and keep its whole
    # output: last round this grep ran BEFORE the self-test, so it could only
    # ever see the preceding restart, and the verdict rested on a tail -20.
    echo "=== analysisd ruleset self-test, in full ==="
    if [ -x /var/ossec/bin/wazuh-analysisd ]; then
      /var/ossec/bin/wazuh-analysisd -t > /tmp/puc2_analysisd_t.out 2>&1
      cat /tmp/puc2_analysisd_t.out
    else
      echo "no /var/ossec/bin/wazuh-analysisd on this image"
      ls /var/ossec/bin/
      : > /tmp/puc2_analysisd_t.out
    fi
    echo "--- did the load acknowledge the PUC2 rules? ---"
    echo "self-test mentions of 1001xx: $(grep -acE '1001[0-9][0-9]' /tmp/puc2_analysisd_t.out)"
    echo "=== analysisd startup lines from TODAY ==="
    grep -a -iE "wazuh-analysisd" /var/ossec/logs/ossec.log \
      | grep -a -F "$TODAY" | tail -12
    # wazuh-makelists is absent on this image and the compile task swallows the
    # error, so the .cdb rule 100101 looks up could silently be older than the
    # hash list it is built from. Surface both timestamps rather than assume.
    echo "=== CTI watchlist vs its compiled .cdb ==="
    ls -l --time-style=+%Y-%m-%dT%H:%M:%S \
      /var/ossec/etc/lists/cti-malware-hashes \
      /var/ossec/etc/lists/cti-malware-hashes.cdb 2>&1
  args:
    executable: /bin/bash
  register: puc2_ruleset_wiring
  changed_when: false
  failed_when: false

- name: Show the ruleset wiring
  ansible.builtin.debug:
    var: puc2_ruleset_wiring.stdout_lines

# The default ossec.conf <ruleset> already includes etc/decoders and etc/rules,
# so the files above are picked up without extra wiring. Verify it rather than
# assume it: a silently unloaded ruleset means no alerts and no containment.
# wazuh-logtest reports the decoder and rule that matched the line it was given
# — it never lists the loaded ruleset. Grepping its output for rule ids after
# feeding it the string 'test' therefore reported all four rules and the decoder
# MISSING on every single run, whether or not they had loaded, and did it from a
# debug task nothing blocked on. Feed it the real firewall line instead and
# require rule 100102 back — which needs local_rules.xml loaded AND the rule
# placed where this event actually reaches it. Read the "Rule debugging" block
# in the output: a rule that is loaded but misplaced never appears there at all.
- name: Verify the PUC2 2c rules and decoder are loaded
  ansible.builtin.shell: |
    set -o pipefail
    printf '%s\n' {{ puc2_logtest_probe_line | quote }} \
      | /var/ossec/bin/wazuh-logtest -v 2>&1
  args:
    executable: /bin/bash
  register: puc2_ruleset_check
  changed_when: false
  failed_when: false

- name: FAIL if analysisd did not load the PUC2 2c ruleset
  ansible.builtin.assert:
    that:
      - "'100102' in (puc2_ruleset_check.stdout | default(''))"
    fail_msg: >-
      analysisd did not match the PUC2 2c firewall probe line to rule 100102,
      so the ruleset it is running is NOT the one just deployed. Rules
      100100-100103 cannot fire, containment never triggers, and levels L10,
      L12, L19 and L21 have no evidence to show. Read the "Rule debugging"
      block below against the ruleset wiring printed by the previous task:
      100102 listed as tried but not matched means the <match> is wrong;
      100102 absent from the list while the wiring shows etc/rules loaded means
      the rule is loaded but parked where this event never reaches it (check
      <if_sid> against the id the traversal actually descends into); 100102
      absent AND no etc/rules in the <ruleset> block means local_rules.xml is
      not loaded at all. If Phase 2 shows no firewall fields, the endpoint's
      log format changed instead. analysisd said:
      {{ puc2_ruleset_check.stdout | default('(no output)') }}
    success_msg: >-
      analysisd matched the probe line to rule 100102 — local_rules.xml is
      loaded and the built-in firewall decoding feeds it.
