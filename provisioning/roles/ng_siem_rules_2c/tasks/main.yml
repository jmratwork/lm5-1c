---
# =============================================================================
# role: ng_siem_rules_2c        (host: ng-siem — runs AFTER the ng-siem role)
#
# ADDITIVE OVERLAY on top of the siemng image configured by the integrations
# substrate. It does NOT redeploy Wazuh and it does NOT touch the substrate's
# MISP / custom-iris integration block: that block owns the marker
#   <!-- ... ANSIBLE MANAGED CYBERRANGE INTEGRATIONS -->
# while everything here lives under a DISTINCT marker
#   <!-- ... ANSIBLE MANAGED PUC2-2C DETECTION AND RESPONSE -->
#
# UML coverage:
#   step 3  - telemetry (file hash) correlated by rule 100100
#   step 4  - CTI hash watchlist (CDB list) feeding rule 100101
#   step 5  - "malware detected" alert (rule 100101, level 12)
#   step 6  - correlated targeted-attack confirmation (rule 100103, level 14)
#   step 9/10 - rule 100103 launches the puc2-isolate active response on the
#               originating agent (location=local). Only the correlated rule
#               triggers it, so containment follows confirmation instead of
#               interrupting the delivery — see group_vars/puc2_2c.yml.
# =============================================================================

- name: Assert the substrate ng-siem role already ran on this host
  ansible.builtin.stat:
    path: /var/ossec/etc/ossec.conf
  register: puc2_ossec_conf
  failed_when: not puc2_ossec_conf.stat.exists

# ── Firewall decoder: removed, it could never run (UML step 6) ───────────────
# puc2_local_decoder.xml declared a prematch and no <program_name>. analysisd
# keeps decoders in two lists, one for those declaring a program_name and one
# for those that do not, and an event that carries a program_name is only ever
# matched against the first — so this decoder sat in a list the endpoint's
# kernel lines never consulted. wazuh-logtest showed the built-in `kernel`
# decoder taking the line and populating srcip, dstip, srcport, dstport and
# protocol on its own; rule 100102 now keys on that instead. Ranges provisioned
# before this change still carry the file, so remove it rather than just
# stopping deploying it: an unreachable decoder left on disk reads like
# working detection to whoever looks next.
- name: Remove the unreachable PUC2 2c firewall decoder
  ansible.builtin.file:
    path: /var/ossec/etc/decoders/puc2_local_decoder.xml
    state: absent
  notify: restart wazuh-manager

# ── Detection rules (UML steps 3, 5, 6) ──────────────────────────────────────
# ── Detection rules go where this image demonstrably loads them ──────────────
# They lived in etc/rules for five deployments and analysisd never once
# acknowledged them: not one load warning, not one appearance in a rule
# traversal, through four different ways of keying rule 100102. ruleset/rules
# is the directory the 6362 built-in rules come from, including 4100 which
# rule 100102 hangs off, so it is provably read on this image.
#
# This is a deliberate deviation: Wazuh treats ruleset/rules as its own and a
# manager package upgrade can overwrite it. That is an acceptable trade for a
# pinned sandbox image and it is reversible the moment etc/rules is shown to
# work. The 9999- prefix keeps the file last in load order, so 4100 is defined
# before anything references it.
- name: Deploy PUC2 2c correlation rules
  ansible.builtin.template:
    src: local_rules.xml.j2
    dest: /var/ossec/ruleset/rules/9999-puc2-2c.xml
    owner: wazuh
    group: wazuh
    mode: '0660'
  notify: restart wazuh-manager

# The negative half of the controlled pair - see templates/etc_rules_probe.xml.j2.
# It replaces the copy of the real rules that used to sit here, so there is no
# second definition of 100100-100103 anywhere and no duplicate-sid risk.
- name: Deploy the etc/rules control probe
  ansible.builtin.template:
    src: etc_rules_probe.xml.j2
    dest: /var/ossec/etc/rules/local_rules.xml
    owner: wazuh
    group: wazuh
    mode: '0660'
  notify: restart wazuh-manager

# ── CTI hash watchlist (UML step 4) ──────────────────────────────────────────
# CDB list keyed by MD5; rule 100101 does lookup="match_key" against it. The
# cti_ss_2c role seeds the very same IOCs into MISP so the SIEM enrichment and
# the analyst's CTI lookup agree.
- name: Ensure the Wazuh lists directory exists
  ansible.builtin.file:
    path: /var/ossec/etc/lists
    state: directory
    owner: wazuh
    group: wazuh
    mode: '0750'

- name: Deploy the CTI malware hash watchlist
  ansible.builtin.copy:
    dest: /var/ossec/etc/lists/cti-malware-hashes
    owner: wazuh
    group: wazuh
    mode: '0660'
    content: |
      {{ puc2_payload_md5 }}:puc2-2c-training-payload
      {{ puc2_payload_sha256 }}:puc2-2c-training-payload
  notify: restart wazuh-manager

- name: Compile the CDB lists
  ansible.builtin.command: /var/ossec/bin/wazuh-makelists
  register: puc2_makelists
  changed_when: puc2_makelists.rc == 0
  failed_when: false

# ── Active response wiring (UML steps 9-10) ──────────────────────────────────
# Distinct marker: must never collide with the substrate's integration block.
- name: Register the PUC2 2c list, command and active response in ossec.conf
  ansible.builtin.blockinfile:
    path: /var/ossec/etc/ossec.conf
    insertbefore: "</ossec_config>"
    marker: "<!-- {mark} ANSIBLE MANAGED PUC2-2C DETECTION AND RESPONSE -->"
    block: |
      <!-- CTI-SS hash watchlist consumed by rule 100101 (UML step 4) -->
      <ruleset>
        <list>etc/lists/cti-malware-hashes</list>
      </ruleset>

      <!-- Containment action executed on the affected endpoint (UML step 10) -->
      <command>
        <name>puc2-isolate</name>
        <executable>puc2-isolate</executable>
        <timeout_allowed>no</timeout_allowed>
      </command>

      <active-response>
        <command>puc2-isolate</command>
        <location>local</location>
        <rules_id>{{ puc2_active_response_rules }}</rules_id>
      </active-response>
  notify: restart wazuh-manager

# ── Validate and apply ───────────────────────────────────────────────────────
# NOTE ON WHAT THIS PROVES: `verify-agent-conf` validates the SHARED AGENT
# configuration (agent.conf) — not ossec.conf, and not the ruleset this role
# just wrote. It is kept because a broken agent.conf is worth catching here,
# but it must not be mistaken for a check that the rules load. That check is
# the ruleset test in the puc2_preflight gate, which asks analysisd directly.
- name: Validate the shared agent configuration after the PUC2 2c injection
  ansible.builtin.shell: |
    result=$(/var/ossec/bin/verify-agent-conf 2>&1)
    if echo "$result" | grep -qi "error\|critical"; then
      echo "CONF_ERROR: $result"
    else
      echo "CONF_OK"
    fi
  args:
    chdir: /var/ossec
  register: puc2_ossec_check
  changed_when: false

- name: FAIL if the PUC2 2c injection broke the agent configuration
  ansible.builtin.fail:
    msg: "agent.conf failed after the PUC2 2c injection: {{ puc2_ossec_check.stdout }}"
  when: "'CONF_ERROR' in puc2_ossec_check.stdout"

- name: Fix ossec.conf ownership after the injection
  ansible.builtin.file:
    path: /var/ossec/etc/ossec.conf
    owner: root
    group: wazuh
    mode: '0660'

- name: Apply the PUC2 2c ruleset now
  ansible.builtin.meta: flush_handlers

- name: Wait for wazuh-manager to be active again
  ansible.builtin.command: systemctl is-active wazuh-manager
  register: puc2_wazuh_status
  until: puc2_wazuh_status.stdout == "active"
  retries: 12
  delay: 5
  changed_when: false

# ── Prove the ruleset actually loaded ────────────────────────────────────────
# Context for the probe below, gathered BEFORE it so a failure is diagnosable
# from the deployment log alone. Two very different faults produce the same
# "100102 did not come back": local_rules.xml is not loaded at all, or it is
# loaded and the rule sits somewhere the event never reaches. Nothing collected
# so far can tell them apart, which is why this block exists — it is evidence,
# never a verdict; the assert stays with the live probe.
- name: Collect the ruleset wiring analysisd is running with
  ansible.builtin.shell: |
    echo "=== <ruleset> block in ossec.conf ==="
    sed -n '/<ruleset>/,/<\/ruleset>/p' /var/ossec/etc/ossec.conf
    echo "=== rule counts analysisd reported at startup ==="
    grep -iE "rules enabled|decoders enabled|lists enabled" \
      /var/ossec/logs/ossec.log | tail -5
    echo "=== anything analysisd said about etc/rules ==="
    grep -iE "local_rules|9999-puc2|etc/rules" /var/ossec/logs/ossec.log | tail -5
    echo "=== what is actually deployed ==="
    ls -la /var/ossec/etc/rules/ /var/ossec/ruleset/rules/9999-puc2-2c.xml
    echo "=== can the wazuh user read both ==="
    sudo -u wazuh head -1 /var/ossec/ruleset/rules/9999-puc2-2c.xml 2>&1 | head -2
    sudo -u wazuh head -1 /var/ossec/etc/rules/local_rules.xml 2>&1 | head -2
    # THE CONTROLLED PAIR. Run the ruleset self-test FIRST and keep its whole
    # output: last round this grep ran BEFORE the self-test, so it could only
    # ever see the preceding restart, and the verdict rested on a tail -20.
    echo "=== analysisd ruleset self-test, in full ==="
    if [ -x /var/ossec/bin/wazuh-analysisd ]; then
      /var/ossec/bin/wazuh-analysisd -t > /tmp/puc2_analysisd_t.out 2>&1
      cat /tmp/puc2_analysisd_t.out
    else
      echo "no /var/ossec/bin/wazuh-analysisd on this image"
      ls /var/ossec/bin/
      : > /tmp/puc2_analysisd_t.out
    fi
    echo "--- CONTROL: 100199 lives in ruleset/rules, 100198 in etc/rules ---"
    echo "self-test  100199: $(grep -c 100199 /tmp/puc2_analysisd_t.out)  100198: $(grep -c 100198 /tmp/puc2_analysisd_t.out)"
    echo "ossec.log  100199: $(grep -c 100199 /var/ossec/logs/ossec.log)  100198: $(grep -c 100198 /var/ossec/logs/ossec.log)"
    echo "=== last analysisd startup lines ==="
    grep -iE "wazuh-analysisd" /var/ossec/logs/ossec.log | tail -12
    # wazuh-makelists is absent on this image and the compile task swallows the
    # error, so the .cdb rule 100101 looks up could silently be older than the
    # hash list it is built from. Surface both timestamps rather than assume.
    echo "=== CTI watchlist vs its compiled .cdb ==="
    ls -l --time-style=+%Y-%m-%dT%H:%M:%S \
      /var/ossec/etc/lists/cti-malware-hashes \
      /var/ossec/etc/lists/cti-malware-hashes.cdb 2>&1
  args:
    executable: /bin/bash
  register: puc2_ruleset_wiring
  changed_when: false
  failed_when: false

- name: Show the ruleset wiring
  ansible.builtin.debug:
    var: puc2_ruleset_wiring.stdout_lines

# The default ossec.conf <ruleset> already includes etc/decoders and etc/rules,
# so the files above are picked up without extra wiring. Verify it rather than
# assume it: a silently unloaded ruleset means no alerts and no containment.
# wazuh-logtest reports the decoder and rule that matched the line it was given
# — it never lists the loaded ruleset. Grepping its output for rule ids after
# feeding it the string 'test' therefore reported all four rules and the decoder
# MISSING on every single run, whether or not they had loaded, and did it from a
# debug task nothing blocked on. Feed it the real firewall line instead and
# require rule 100102 back — which needs local_rules.xml loaded AND the rule
# placed where this event actually reaches it. Read the "Rule debugging" block
# in the output: a rule that is loaded but misplaced never appears there at all.
- name: Verify the PUC2 2c rules and decoder are loaded
  ansible.builtin.shell: |
    set -o pipefail
    printf '%s\n' {{ puc2_logtest_probe_line | quote }} \
      | /var/ossec/bin/wazuh-logtest -v 2>&1
  args:
    executable: /bin/bash
  register: puc2_ruleset_check
  changed_when: false
  failed_when: false

- name: FAIL if analysisd did not load the PUC2 2c ruleset
  ansible.builtin.assert:
    that:
      - "'100102' in (puc2_ruleset_check.stdout | default(''))"
    fail_msg: >-
      analysisd did not match the PUC2 2c firewall probe line to rule 100102,
      so the ruleset it is running is NOT the one just deployed. Rules
      100100-100103 cannot fire, containment never triggers, and levels L10,
      L12, L19 and L21 have no evidence to show. Read the "Rule debugging"
      block below against the ruleset wiring printed by the previous task:
      100102 listed as tried but not matched means the <match> is wrong;
      100102 absent from the list while the wiring shows etc/rules loaded means
      the rule is loaded but parked where this event never reaches it (check
      <if_sid> against the id the traversal actually descends into); 100102
      absent AND no etc/rules in the <ruleset> block means local_rules.xml is
      not loaded at all. If Phase 2 shows no firewall fields, the endpoint's
      log format changed instead. analysisd said:
      {{ puc2_ruleset_check.stdout | default('(no output)') }}
    success_msg: >-
      analysisd matched the probe line to rule 100102 — local_rules.xml is
      loaded and the built-in firewall decoding feeds it.
