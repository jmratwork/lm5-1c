---
- name: Set password on User ubuntu
  ansible.builtin.user:
    name: ubuntu
    # Sourced from ansible-vault. omit = leave the account password alone when
    # none is provided, rather than setting an empty one. The literal that used
    # to be here is public on GitHub: see validation/SECURITY_ROTATION.md.
    password: "{{ vault_ubuntu_password_hash | default(omit) }}"
    update_password: always
  no_log: true

- name: Save docker-server internal (topology) IP fact
  ansible.builtin.set_fact:
    docker_server_internal_ip: "{{ ansible_all_ipv4_addresses | select('match', '^10\\.') | first }}"
    cacheable: yes

- name: Install Docker prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - smbclient
      - cifs-utils
      - unzip
    state: present
    update_cache: yes

- name: Create /etc/apt/keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Download Docker GPG key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Add Docker APT repository
  ansible.builtin.shell: |
    echo "deb [arch=$(dpkg --print-architecture) signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu $(. /etc/os-release && echo "${UBUNTU_CODENAME:-$VERSION_CODENAME}") stable" | tee /etc/apt/sources.list.d/docker.list > /dev/null
  args:
    creates: /etc/apt/sources.list.d/docker.list
  register: repo_add
  changed_when: repo_add.rc == 0

- name: Update APT cache after adding repository
  ansible.builtin.apt:
    update_cache: yes

- name: Install Docker packages
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: present
    update_cache: yes

- name: Ensure Docker service is started and enabled
  ansible.builtin.service:
    name: docker
    state: started
    enabled: yes

- name: Create mount point
  ansible.builtin.file:
    path: "/mnt/smb_shared"
    state: directory
    mode: "0775"
    
- name: Mount SMB Share (guest)
  ansible.builtin.mount:
    src: "//10.250.232.198/shared"
    path: "/mnt/smb_shared"
    fstype: cifs
    opts: "guest,vers=3.0"
    state: mounted

- name: Copy RITA zip from SMB to destination
  ansible.builtin.copy:
    src: "/mnt/smb_shared/rita-docker.zip"
    dest: "/opt/rita-docker.zip"
    remote_src: true
    mode: "0644"
  when: puc2_deploy_rita | default(false) | bool

- name: Copy DFIR-IRIS zip from SMB to destination
  copy:
    src: "/mnt/smb_shared/dfir-iris-custom.zip"
    dest: "/opt/dfir-iris-custom.zip"
    remote_src: true
    mode: "0644"
  register: iris_bundle_copy

# The IRIS bundle comes from the SMB share, outside this repo, and can change
# between deploys without a commit here. When IRIS breaks in a way no commit
# explains (2026-10-11: nginx exiting on start), the first question is whether
# the bundle changed - and no earlier log kept its checksum to compare against.
# Reference, from the 2026-10-11 15:07 deploy - the NEW bundle (nginx "8080:80",
# worker "app:8000"), on the share since about 2026-10-07: sha1
# 061bfacf2bb3ec4d0bb221332b29b005c46b2187, md5 d8913efbd84ad8ecf3762ca689032ca9,
# 15109320 bytes. (copy reports md5sum only when it actually copies; the sha1
# checksum is always there.)
- name: Record which DFIR-IRIS bundle this deploy uses
  ansible.builtin.debug:
    msg: >-
      DFIR-IRIS bundle: sha1 {{ iris_bundle_copy.checksum | default('?') }},
      md5 {{ iris_bundle_copy.md5sum | default('(not reported, unchanged copy)') }},
      {{ iris_bundle_copy.size | default('?') }} bytes, from
      /mnt/smb_shared/dfir-iris-custom.zip. Compare with the previous deploy's
      log when IRIS behaves differently.

- name: Create NG-SOAR directory for the yml
  file:
    path: "/opt/NG-SOAR"
    state: directory
    mode: "0755"

- name: Create MISP directory for the git repo
  file:
    path: "/opt/misp-docker"
    state: directory
    mode: "0755"

- name: Copy NG-SOAR yml from SMB to destination
  copy:
    src: "/mnt/smb_shared/NG-SOAR.yml"
    dest: "/opt/NG-SOAR/docker-compose.yml"
    remote_src: true
    mode: "0644"

- name: Unarchive RITA Docker bundle
  ansible.builtin.unarchive:
    src: "/opt/rita-docker.zip"
    dest: "/opt/"
    remote_src: true
    extra_opts: ["-o"]
  when: puc2_deploy_rita | default(false) | bool

- name: Unzip rita frontend dist.zip
  ansible.builtin.unarchive:
    src: "/opt/rita-docker/frontend-container/rita-frontend/dist.zip"
    dest: "/opt/rita-docker/frontend-container/rita-frontend"
    remote_src: true
    extra_opts: ["-o"]
  when: puc2_deploy_rita | default(false) | bool

- name: Unzip DFIR-IRIS Docker
  unarchive:
    src: "/opt/dfir-iris-custom.zip"
    dest: "/opt/"
    remote_src: true
    extra_opts: ["-o"]

- name: Ensure RITA Docker network exists
  community.docker.docker_network:
    name: rita-network
    state: present
  when: puc2_deploy_rita | default(false) | bool

#- name: Ensure NG-SOAR network exists
#  community.docker.docker_network:
#    name: db-net
#    state: present

# Authenticated pulls only raise the Docker Hub rate limit; they are not required.
# With no PAT in vault this is skipped and images are pulled anonymously, which is
# why it is guarded rather than left to fail on an empty password. The literal PAT
# that used to be here is public on GitHub: see validation/SECURITY_ROTATION.md.
- name: Login to Docker Hub
  community.docker.docker_login:
    username: "{{ vault_dockerhub_user | default('') }}"
    password: "{{ vault_dockerhub_pat | default('') }}"
  when: (vault_dockerhub_pat | default('')) | length > 0
  no_log: true

# Anonymous pulls are rate-limited, and on this range that limit is reached: a
# deployment with no PAT fails later, deep inside a docker compose task, with a
# raw 429 on an image like rabbitmq that says nothing about the skipped login.
# This says it up front. It warns rather than fails because anonymous pulls do
# succeed when the limit has not been hit (cached images, a fresh egress IP).
# ── Fall back to the substrate's published credential ────────────────────────
# Only when no PAT was supplied. See defaults/main.yml for what this credential
# is, why it is read at deploy time instead of stored here, and what it costs.
#
# The secret is fetched, piped into `docker login --password-stdin` and
# discarded inside one shell. It is never an Ansible variable, never a process
# argument, and never written to this repo. Only the username and the outcome
# are printed - which is why this task does NOT need no_log, and is better for
# it: the deploy log says which path authentication took.
#
# Nothing here is fatal. A revoked credential, a moved upstream file, no route
# to raw.githubusercontent.com - all end in an anonymous pull, which is what
# happened before this existed.
- name: Authenticate to Docker Hub with the substrate's published credential
  ansible.builtin.shell: |
    set -uo pipefail
    raw=$(curl -fsS --max-time 20 {{ substrate_docker_login_url | quote }}) \
      || { echo "FETCH_FAILED - could not read the upstream role over HTTPS"; exit 0; }
    u=$(printf '%s' "$raw" | grep -A3 'docker_login' | grep -i 'username:' \
        | head -1 | sed 's/.*username:[[:space:]]*//' | tr -d '"\047 \r')
    p=$(printf '%s' "$raw" | grep -A3 'docker_login' | grep -i 'password:' \
        | head -1 | sed 's/.*password:[[:space:]]*//' | tr -d '"\047 \r')
    if [ -z "$u" ] || [ -z "$p" ]; then
      echo "NOT_FOUND - upstream no longer carries a docker_login credential"
      exit 0
    fi
    if printf '%s' "$p" | docker login --username "$u" --password-stdin >/dev/null 2>&1; then
      echo "LOGGED_IN as $u"
    else
      echo "REJECTED - Docker Hub refused the credential for $u (rotated or revoked)"
    fi
  args:
    executable: /bin/bash
  register: substrate_login
  changed_when: "'LOGGED_IN' in substrate_login.stdout"
  failed_when: false
  when:
    - substrate_docker_login_enabled | bool
    - (vault_dockerhub_pat | default('')) | length == 0

- name: Report how Docker Hub authentication ended up
  ansible.builtin.debug:
    msg: >-
      Docker Hub auth:
      {% if (vault_dockerhub_pat | default('')) | length > 0 %}
      using the PAT supplied on the command line.
      {% elif 'LOGGED_IN' in (substrate_login.stdout | default('')) %}
      {{ substrate_login.stdout | trim }} - pulls are counted against that
      account rather than this sandbox's egress IP.
      {% else %}
      ANONYMOUS. {{ substrate_login.stdout | default('substrate login disabled') | trim }}.
      Pulls now count against the per-IP quota shared by every sandbox on the
      platform. The pre-pull below still takes four of the six images off Docker
      Hub, so two anonymous pulls remain - usually enough. If this run does die
      on a 429, supply your own token:
      -e vault_dockerhub_pat=... -e vault_dockerhub_user=...
      {% endif %}

# Which pool the pulls will actually be billed to. Both paths lead to an
# authenticated pull: a PAT on the command line, or the substrate credential
# this role logged in with above. Only the preflight cares, and it cares a great
# deal - see the note on the gate.
- name: Record whether Docker Hub pulls will be authenticated
  ansible.builtin.set_fact:
    docker_hub_authenticated: >-
      {{ ((vault_dockerhub_pat | default('')) | length > 0)
         or ('LOGGED_IN' in (substrate_login.stdout | default(''))) }}

# ═════════════════════════════════════════════════════════════════════════════
# PREFLIGHT: is there enough Docker Hub quota to be worth starting?
#
# The 2026-09-10 09:37 build spent twenty minutes cloning MISP, building it,
# starting NG-SOAR and patching DFIR-IRIS before discovering, on the sixth
# image, that the quota was gone. The information needed to stop was available
# before the first pull. Ask for it there.
#
# Docker publishes the headroom on a dedicated probe repository, and a HEAD on
# a manifest is documented as not consuming a pull - so measuring costs nothing.
# ═════════════════════════════════════════════════════════════════════════════
- name: Preflight the Docker Hub rate limit before pulling anything
  when: docker_hub_preflight_enabled | bool
  block:
    # The probe authenticates only with a command-line PAT, so when the
    # credential in force is the substrate's the numbers below describe the
    # ANONYMOUS pool - not the one the pulls will use. The gate accounts for
    # that; nothing else here needs to.
    - name: Get a registry token for the rate-limit probe
      ansible.builtin.uri:
        url: >-
          https://auth.docker.io/token?service=registry.docker.io&scope=repository:ratelimitpreview/test:pull
        method: GET
        return_content: true
        url_username: "{{ vault_dockerhub_user | default(omit, true) }}"
        url_password: "{{ vault_dockerhub_pat | default(omit, true) }}"
        force_basic_auth: "{{ (vault_dockerhub_pat | default('')) | length > 0 }}"
        timeout: 20
      register: hub_token
      failed_when: false
      no_log: true

    # HEAD, not GET: a GET here would spend one of the very pulls being counted.
    - name: Read the rate-limit headers
      ansible.builtin.uri:
        url: https://registry-1.docker.io/v2/ratelimitpreview/test/manifests/latest
        method: HEAD
        headers:
          Authorization: "Bearer {{ hub_token.json.token | default('') }}"
          Accept: application/vnd.docker.distribution.manifest.v2+json
        status_code: [200, 401, 429]
        timeout: 20
      register: hub_limit
      failed_when: false

    # Headers look like "100;w=21600" - the count is everything before the ';'.
    # They are ABSENT for accounts with no limit at all, which is a pass, not a
    # failure: `remaining` stays -1 and means "unmeasurable", never "empty".
    - name: Work out how much headroom there is
      ansible.builtin.set_fact:
        hub_remaining: >-
          {{ ((hub_limit.ratelimit_remaining | default('')) | string).split(';')[0]
             | default('', true) | int(-1) }}
        hub_limit_total: >-
          {{ ((hub_limit.ratelimit_limit | default('')) | string).split(';')[0]
             | default('', true) | int(-1) }}

    - name: Report the Docker Hub headroom
      ansible.builtin.debug:
        msg: >-
          Docker Hub rate limit:
          {% if hub_limit.status | default(0) == 429 %}
          ALREADY EXHAUSTED - the registry answered 429 to the probe itself.
          {% elif (hub_remaining | int) < 0 %}
          not reported by the registry (an unlimited account, or the probe could
          not be reached). Proceeding; a 429 later will still be named by the
          compose tasks.
          {% else %}
          {{ hub_remaining }} of {{ hub_limit_total }} pulls remaining; this
          deploy needs about {{ docker_hub_required_pulls }}.
          {% endif %}
          {% if docker_hub_authenticated | bool %}
          These are ANONYMOUS figures and this deploy is authenticated, so they
          describe a pool it will not use - measured because the probe cannot
          authenticate without a command-line PAT. Informational only; the gate
          below does not act on them.
          {% else %}
          Anonymous - the quota is shared by every sandbox on this egress IP,
          and it is the pool this deploy will pull from.
          {% endif %}

    # Blocking, but only on a MEASURED shortfall IN THE POOL THIS DEPLOY WILL
    # USE. Three ways out, and each one is a lesson already paid for:
    #
    #  * An unreachable probe or an unpublished limit (remaining -1). "Could not
    #    measure" must never read as "empty" - the same reason the NG-SIEM gate
    #    does not fail when agent_control is missing from the image.
    #
    #  * AUTHENTICATED pulls. The probe can only authenticate with a
    #    command-line PAT, so when the credential in force is the substrate's it
    #    measures the anonymous per-IP pool instead - a pool the deploy will not
    #    touch. On 2026-09-10 12:53 that cost a working deployment: `docker
    #    login` had succeeded as demongsoc, four of the six images had left
    #    Docker Hub entirely, two authenticated pulls remained against a
    #    200/hour account - and this gate stopped the run at task 23 because the
    #    egress IP's anonymous quota, which nothing was going to spend, read 0.
    #    A gate measuring the wrong pool is worse than no gate: it fails the
    #    healthy case, which is exactly what it exists to avoid.
    #
    # The 429 fail-fast on the compose tasks remains the safety net for the
    # authenticated path, and it names the PAT when it fires.
    - name: GATE - do not start a build the quota cannot finish
      ansible.builtin.assert:
        that:
          - (docker_hub_authenticated | bool) or hub_limit.status | default(0) != 429
          - >-
            (docker_hub_authenticated | bool)
            or (hub_remaining | int) < 0
            or (hub_remaining | int) >= (docker_hub_required_pulls | int)
        fail_msg: >-
          Stopping before the first pull: this deploy pulls ANONYMOUSLY and
          Docker Hub has
          {{ 'already returned 429 to the probe'
             if hub_limit.status | default(0) == 429
             else hub_remaining ~ ' pulls left, against about '
                  ~ docker_hub_required_pulls ~ ' needed' }}.
          Starting now would clone MISP, build it, start NG-SOAR and then die on
          an image twenty minutes in - which is exactly what the 2026-09-10
          09:37 build did. {{ docker_hub_rate_limit_help }}
        success_msg: >-
          {% if docker_hub_authenticated | bool %}
          Docker Hub gate does not apply - pulls are authenticated, so the
          anonymous figures above are not this deploy's pool. A 429 on an
          authenticated pull is still caught, by name, at the compose task.
          {% else %}
          Docker Hub headroom is sufficient for an anonymous deploy
          ({{ 'unmeasured' if (hub_remaining | int) < 0 else hub_remaining ~ ' pulls' }}).
          {% endif %}

# ═════════════════════════════════════════════════════════════════════════════
# Spend less of that quota: pull four of the six images from registries that do
# not share Docker Hub's per-IP limit, and re-tag them under their Docker Hub
# names so compose finds them in the local cache and never asks Docker Hub.
# See defaults/main.yml for the digest comparison proving these are the same
# images, and for why this re-tags instead of editing three upstream compose
# files.
#
# NEVER FATAL. A tag that has moved is simply left to Docker Hub, which is the
# behaviour that existed before this task. The report says which.
# ═════════════════════════════════════════════════════════════════════════════
- name: Pre-pull images from registries that are not rate-limited
  ansible.builtin.shell: |
    set -u
    seed() {
      hub="$1"; src="$2"
      if docker image inspect "$hub" >/dev/null 2>&1; then
        echo "CACHED  $hub (already local, no pull needed)"
        return
      fi
      if docker pull "$src" >/dev/null 2>&1; then
        docker tag "$src" "$hub"
        echo "SEEDED  $hub <- $src"
      else
        echo "MISS    $hub (not at $src - will come from Docker Hub)"
      fi
    }
    {% for i in docker_hub_prepull %}
    seed {{ i.hub | quote }} {{ i.from | quote }}
    {% endfor %}
  args:
    executable: /bin/bash
  register: hub_seed
  changed_when: "'SEEDED' in hub_seed.stdout"
  failed_when: false

- name: Report which images avoided Docker Hub
  ansible.builtin.debug:
    msg: >-
      {{ hub_seed.stdout_lines | default(['(pre-pull did not run)']) }}
      Every CACHED or SEEDED line is one Docker Hub pull this deploy does not
      make. Only cossas/soarca and cyentific/cacao-roaster have to come from
      Docker Hub - they are published nowhere else.

- name: Download MISP docker
  git:
    repo: "https://github.com/MISP/misp-docker.git"
    dest: "/opt/misp-docker"
    # Pinned, not `master`. See misp_docker_version in defaults/main.yml for
    # which revision, why, and how to move it.
    version: "{{ misp_docker_version }}"
  
- name: Copy MISP env
  copy:
    src: /opt/misp-docker/template.env
    dest: /opt/misp-docker/.env
    remote_src: yes

# ── The port variables misp-docker reads ─────────────────────────────────────
# Upstream split nginx out of misp-core, and that container owns the host ports:
#     - "${NGINX_HTTP_PORT:-80}:8080"
#     - "${NGINX_HTTPS_PORT:-443}:8443"
# The names used to be CORE_HTTP_PORT / CORE_HTTPS_PORT. Nothing read those any
# more, so MISP published on 80/443 while the whole project addressed :8443, and
# the 2026-09-10 12:22 build died on `MISP /servers/getVersion -> HTTP -1`.
#
# This role wrote BOTH names for a while, to survive whichever revision the clone
# landed on. It no longer does: the clone and its images are now pinned together
# to one upstream commit (misp_docker_version / misp_docker_images in defaults),
# so there is one naming to satisfy. Upstream's misp-core entrypoint has also
# since declared CORE_HTTP_PORT / CORE_HTTPS_PORT deprecated and exits 1 if either
# reaches the container. They never did - the compose passes no env_file and never
# lists them - but writing names upstream has made fatal is a trap waiting for the
# next compose change.
- name: Publish MISP on the ports this project addresses (current upstream names)
  ansible.builtin.lineinfile:
    path: /opt/misp-docker/.env
    regexp: "^#?\\s*{{ item.key }}="
    line: "{{ item.key }}={{ item.value }}"
    state: present
  loop:
    - { key: 'NGINX_HTTP_PORT', value: "{{ misp_http_host_port }}" }
    - { key: 'NGINX_HTTPS_PORT', value: "{{ misp_https_host_port }}" }
  loop_control:
    label: "{{ item.key }}={{ item.value }}"

- name: Change BASE_URL in env for MISP
  lineinfile:
    path: /opt/misp-docker/.env
    regexp: '^#?\s*BASE_URL='
    line: 'BASE_URL=https://{{ docker_server_internal_ip }}:{{ misp_https_host_port }}'
    state: present
    insertafter: EOF
    backup: yes

# ── Silence the 130-odd "variable is not set" warnings from MISP compose ─────
# misp-docker's compose file references a large optional surface (LDAP, OIDC,
# Azure AD, S3, SES, proxy, PyPI pins) that template.env ships commented out. On
# every deploy compose emits one warning per unset variable — about 130 of them,
# which is the overwhelming majority of the warnings in the build log and the
# noise a real problem has to be spotted against.
#
# The names are DERIVED from the compose file rather than listed here: the pinned
# misp-docker revision gets bumped over time, and a hardcoded list would silently
# rot at the first bump that adds a variable.
#
# Only BARE `${VAR}` references are touched — the exact set compose warns about.
# For those, compose already substitutes an empty string, so writing `VAR=`
# makes explicit what is happening anyway and cannot change behaviour. A
# reference carrying a default (`${VAR:-x}`) is skipped: it never warns, and
# leaving it alone keeps its default intact.
#
# `grep -qE "^[[:space:]]*VAR="` matches only UNCOMMENTED definitions, so a
# variable template.env or the tasks above actually set is never overwritten.
- name: Pin every unset MISP compose variable to an explicit empty value
  ansible.builtin.shell: |
    set -u
    cd /opt/misp-docker || { echo "ADDED=0 (no /opt/misp-docker)"; exit 0; }
    compose=""
    for f in docker-compose.yml compose.yml docker-compose.yaml; do
      [ -f "$f" ] && compose="$compose $f"
    done
    [ -n "$compose" ] || { echo "ADDED=0 (no compose file found)"; exit 0; }
    added=0
    for v in $(grep -ohE '\$\{[A-Za-z_][A-Za-z0-9_]*\}' $compose \
               | tr -d '${}' | sort -u); do
      if ! grep -qE "^[[:space:]]*${v}=" .env; then
        echo "${v}=" >> .env
        added=$((added+1))
      fi
    done
    echo "ADDED=$added"
  args:
    executable: /bin/bash
  register: misp_env_pinned
  changed_when: "'ADDED=0' not in misp_env_pinned.stdout"

- name: Report how many MISP variables were pinned
  ansible.builtin.debug:
    msg: >-
      MISP .env: {{ misp_env_pinned.stdout | trim }} previously-unset compose
      variables pinned to empty. Behaviour is unchanged — compose was already
      substituting a blank string for each of them; the deploy log just stops
      saying so 130 times.

# ── TLS for the misp-nginx container ─────────────────────────────────────────
# The third failure from one upstream restructure, after the compose variables
# and the ports. Splitting nginx out of misp-core moved the ./ssl mount with it,
# and the new container CANNOT create what it needs:
#
#     volumes:  - "./ssl:/etc/nginx/certs:ro"      <- read-only
#     read_only: true
#
# so certificates have to exist on the host first. Upstream's README is explicit
# about the consequence: "SSL is automatically disabled if certificates are
# missing". Not a warning, not a 502 - nginx simply stops listening on 8443
# inside the container, while Docker still publishes the host port. The
# 2026-09-10 13:22 build reached play 8 and died on `MISP /servers/getVersion ->
# HTTP -1` because there was nothing behind a port that looked open.
#
# When misp-core served its own nginx it generated these itself. It does not any
# more, and iris_nginx has needed the same treatment here all along.
#
# Filenames are upstream's (cert.pem / key.pem, optional ca.pem). SANs cover
# both the address group_vars resolves and localhost, so the cert is valid for
# the probe below as well as for a trainee's browser - not that anything
# validates it: every consumer here sets validate_certs false, because a
# self-signed cert on a throwaway range is the point.
- name: Create the SSL directory misp-nginx mounts
  ansible.builtin.file:
    path: /opt/misp-docker/ssl
    state: directory
    mode: '0755'

- name: Generate the self-signed TLS certificate misp-nginx requires
  ansible.builtin.shell: |
    openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
      -keyout /opt/misp-docker/ssl/key.pem \
      -out /opt/misp-docker/ssl/cert.pem \
      -subj '/C=XX/ST=CyberRange/L=Lab/O=CTI-SS/CN={{ docker_server_internal_ip }}' \
      -addext 'subjectAltName = IP:{{ docker_server_internal_ip }}, DNS:localhost, IP:127.0.0.1'
    chmod 644 /opt/misp-docker/ssl/cert.pem
    chmod 644 /opt/misp-docker/ssl/key.pem
  args:
    creates: /opt/misp-docker/ssl/cert.pem

# ── Pin the images, and give misp-core a realistic start-up window ───────────
# Both go in docker-compose.override.yml, which compose loads automatically beside
# docker-compose.yml and which upstream's own .gitignore excludes: it is the
# mechanism misp-docker intends for local adjustment, so nothing upstream is
# edited and the pinned clone stays clean for git.
#
# IMAGES. Pinning the clone alone pinned half the build. The compose file pulls
# ghcr.io/misp/misp-docker/*:${CORE_RUNNING_TAG:-latest}, and upstream CI rebuilt
# `latest` - and the version tag v2.5.46 with it - on 2026-09-11 12:52 from
# e8b11b9. The 2026-09-14 deploy therefore ran a 5fe2022 compose file against
# images built two commits later. Every image is now referenced by DIGEST, from
# the same commit as the clone. Tags on ghcr move; digests do not.
#
# START-UP WINDOW. That deploy failed on `container misp-docker-misp-core-1 is
# unhealthy`. misp-core's healthcheck probes php-fpm on 9002 with a 60s grace
# period, and in images built since bd648a5 the fpm entrypoint runs init_mysql,
# init_misp.sh and configure_misp.sh BEFORE starting php-fpm - a first boot, on
# an empty database, on a sandbox VM. That is the best-supported explanation and
# NOT a proven one: the log held no container output, and two other candidates
# were refuted against upstream's source first. A passing probe ends the start
# period at once, so a healthy MISP is not delayed at all; only a slow first boot
# stops being reported as a broken one. The rescue below now records misp-core's
# own logs, so a failure that survives this names its cause.
- name: Pin MISP images by digest and widen misp-core's start-up window
  ansible.builtin.copy:
    dest: /opt/misp-docker/docker-compose.override.yml
    mode: '0644'
    content: |
      # Managed by the lm5-1c docker_server role - edit the role defaults, not this.
      services:
        misp-core:
          image: "{{ misp_docker_images['misp-core'] }}"
          healthcheck:
            start_period: {{ misp_core_start_period }}
        misp-nginx:
          image: "{{ misp_docker_images['misp-nginx'] }}"
        misp-modules:
          image: "{{ misp_docker_images['misp-modules'] }}"
        misp-guard:
          image: "{{ misp_docker_images['misp-guard'] }}"

# No retry here, and none wanted: this task already fails on the first attempt.
# What it lacked was a reason. MISP pulls mariadb and valkey from Docker Hub, so
# it is just as exposed to the 429 as DFIR-IRIS is - it simply happens to pull
# earlier, while there is still quota left.
- name: Deployment of MISP Docker
  block:
    - name: Deployment of MISP Docker
      community.docker.docker_compose_v2:
        project_src: "/opt/misp-docker"
        state: present
    #    build: always
      register: misp_output

  rescue:
    # A compose failure says WHICH container, never WHY. The 2026-09-14 deploy
    # stopped on "misp-core is unhealthy" with nothing more to go on, and two
    # plausible causes had to be refuted against upstream's source before a third
    # could even be offered - none provable, because misp-core's own output was
    # never collected. Collect it before the failure message, whatever the cause.
    # `cmd:` form, so split_args never parses the script at playbook load.
    - name: Collect misp-core and misp-nginx logs and health state
      ansible.builtin.shell:
        cmd: |
          set +e
          echo "=== containers ==="
          docker ps -a --filter name=misp-docker
          for c in misp-docker-misp-core-1 misp-docker-misp-nginx-1; do
            echo "=== state of $c ==="
            docker inspect --format '{{ "{{" }}json .State{{ "}}" }}' "$c" 2>&1 | cut -c1-3000
            echo "=== last log lines of $c ==="
            docker logs --tail 80 "$c" 2>&1
          done
        executable: /bin/bash
      register: misp_evidence
      changed_when: false
      failed_when: false

    - name: Show why MISP did not come up
      ansible.builtin.debug:
        var: misp_evidence.stdout_lines

    - name: Say whether MISP failed on the Docker Hub rate limit
      ansible.builtin.fail:
        msg: >-
          {% if (misp_output.msg | default('') ~ ' ' ~ misp_output.stderr | default('')) | lower
                is search(docker_hub_rate_limit_pattern) %}
          MISP could not be deployed. {{ docker_hub_rate_limit_help }}
          Docker said: {{ misp_output.msg | default('(no message)') }}
          {% else %}
          MISP could not be deployed, and it is NOT a Docker Hub rate limit.
          misp-core's and misp-nginx's own logs and health state are in the
          task output just above this one - read those first.
          Docker said: {{ misp_output.msg | default('(no message)') }}
          {{ misp_output.stderr | default('') }}
          {% endif %}

# ── Is MISP actually SERVING where the rest of the project thinks it is? ──
# `docker compose up` succeeding means the containers started, NOT that anything
# answers. Two builds died eight plays later on `MISP /servers/getVersion ->
# HTTP -1` for two different reasons, and both were visible right here:
#
#   2026-09-10 12:22  upstream renamed the port variables, so MISP published on
#                     :443 while the project addressed :8443.
#   2026-09-10 13:22  the port was right, but misp-nginx had no certificate and
#                     upstream disables SSL when certificates are missing, so
#                     nothing inside the container listened on 8443 at all.
#
# The first version of this gate used wait_for on the port, and it PASSED during
# the second failure - `elapsed: 0`, while MISP served nothing. docker-proxy
# binds the host port as soon as the container starts, whatever is or is not
# listening behind it, so an open socket here proves only that Docker did its
# half. It cannot see this class of fault, which is most of the point of the
# gate.
#
# So ask for an HTTP response instead. ANY status counts - 200, 302, 403, even
# 502 - because the claim being tested is "TLS terminates and something answers",
# not "MISP is ready". Readiness takes minutes and puc2_keys already waits five
# for it. The retry budget is here only so a container that is still starting is
# not called broken.
- name: Wait for MISP to answer over HTTPS on the port this project addresses
  ansible.builtin.uri:
    url: "https://127.0.0.1:{{ misp_https_host_port }}/"
    method: GET
    validate_certs: false
    status_code: [200, 301, 302, 401, 403, 404, 500, 502, 503]
    timeout: 15
  register: misp_https
  retries: 20
  delay: 15
  until: misp_https.status | default(-1) > 0
  ignore_errors: true

- name: Read back what MISP published and whether it has a certificate
  ansible.builtin.shell: |
    set -o pipefail
    echo "PUBLISHED PORTS:"
    docker compose -f /opt/misp-docker/docker-compose.yml ps --format '{{ "{{" }}.Service{{ "}}" }} {{ "{{" }}.Ports{{ "}}" }}' 2>/dev/null       || docker ps --filter 'name=misp-docker' --format '{{ "{{" }}.Names{{ "}}" }} {{ "{{" }}.Ports{{ "}}" }}'
    echo "SSL DIRECTORY:"
    ls -l /opt/misp-docker/ssl/ 2>&1 || echo "  (missing)"
    echo "NGINX LOG TAIL:"
    docker logs --tail 15 misp-docker-misp-nginx-1 2>&1 || echo "  (no misp-nginx container)"
  args:
    chdir: /opt/misp-docker
    executable: /bin/bash
  register: misp_published
  changed_when: false
  failed_when: false
  when: misp_https is failed or (misp_https.status | default(-1)) < 0

- name: GATE - MISP answers on the port every address in this project uses
  ansible.builtin.assert:
    that:
      - (misp_https.status | default(-1)) > 0
    fail_msg: >-
      Nothing answered HTTPS on {{ misp_https_host_port }}, so every address in
      this project is wrong: group_vars/puc2_2c.yml, cti_lookup.sh,
      share_intel.sh, the preflight dashboard probe, and levels L1/L9/L15/L24 of
      the training definition all say
      https://<docker-server>:{{ misp_https_host_port }}.
      The probe returned status {{ misp_https.status | default('-1') }}
      ({{ misp_https.msg | default('no message') }}).
      TWO CAUSES HAVE DONE THIS, both from upstream restructuring misp-docker
      while this role still cloned it at `master`:
      (1) NO CERTIFICATE. misp-nginx mounts ./ssl read-only and runs read_only,
      so it cannot make its own, and upstream disables SSL outright when
      cert.pem / key.pem are missing - the port stays bound by docker-proxy and
      nothing listens behind it. This role generates them before the compose;
      check the SSL DIRECTORY listing below.
      (2) WRONG PORT. The port variables were renamed
      (CORE_HTTP_PORT/CORE_HTTPS_PORT -> NGINX_HTTP_PORT/NGINX_HTTPS_PORT);
      this role writes the NGINX_* names the pinned revision reads, so check
      PUBLISHED PORTS below against {{ misp_https_host_port }}.
      {{ misp_published.stdout | default('(could not read)') | trim }}
    success_msg: >-
      MISP answers HTTPS on {{ misp_https_host_port }}
      (status {{ misp_https.status | default('?') }}) - the address group_vars,
      the console helpers and the training definition all use.

- name: Deploy Portainer
  community.docker.docker_container:
    name: portainer
    image: portainer/portainer-ce:latest
    state: started
    restart_policy: always
    ports: 
      - "9443:9443"
    volumes:
      - "/var/run/docker.sock:/var/run/docker.sock"
      - "portainer_data:/data"
  register: portainer_output
  when: puc2_deploy_portainer | default(false) | bool

- name: Build and run RITA backend services
  community.docker.docker_compose_v2:
    project_src: "/opt/rita-docker/backend-container"
    state: present
    build: always
  register: backend_compose_output
  when: puc2_deploy_rita | default(false) | bool

- name: Build and run RITA frontend services
  community.docker.docker_compose_v2:
    project_src: "/opt/rita-docker/frontend-container"
    state: present
    build: always
  register: frontend_compose_output
    
  when: puc2_deploy_rita | default(false) | bool
- name: Build and run RITA tools services
  community.docker.docker_compose_v2:
    project_src: "/opt/rita-docker/tools-containers"
    state: present
    build: always
  register: tools_compose_output
  when: puc2_deploy_rita | default(false) | bool

