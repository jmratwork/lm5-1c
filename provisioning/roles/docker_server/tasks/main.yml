# NG-SOAR pulls three Docker Hub images (soarca, cacao-roaster, mongo) - the
# heaviest Docker Hub consumer in this role, and the one that leaves DFIR-IRIS
# without quota when the limit is close.
- name: Build and run NG-SOAR
  block:
    - name: Build and run NG-SOAR
      community.docker.docker_compose_v2:
        project_src: "/opt/NG-SOAR"
        state: present
        build: always
      register: NG_SOAR_output

  rescue:
    - name: Say whether NG-SOAR failed on the Docker Hub rate limit
      ansible.builtin.fail:
        msg: >-
          {% if (NG_SOAR_output.msg | default('') ~ ' ' ~ NG_SOAR_output.stderr | default('')) | lower
                is search(docker_hub_rate_limit_pattern) %}
          NG-SOAR could not be deployed. {{ docker_hub_rate_limit_help }}
          Docker said: {{ NG_SOAR_output.msg | default('(no message)') }}
          {% else %}
          NG-SOAR could not be deployed, and it is NOT a Docker Hub rate limit.
          Docker said: {{ NG_SOAR_output.msg | default('(no message)') }}
          {{ NG_SOAR_output.stderr | default('') }}
          {% endif %}

- name: Get or generate MISP API key for admin user
  community.docker.docker_container_exec:
    container: misp-docker-misp-core-1
    command: "/var/www/MISP/app/Console/cake user change_authkey admin@admin.test"
  register: misp_user_info
  until: misp_user_info.rc == 0
  retries: 30
  delay: 15
  no_log: true          # stdout IS the new API key

- name: Save MISP API key fact
  set_fact:
    misp_api_key: "{{ misp_user_info.stdout.split('Old authentication keys disabled and new key created: ')[1] | trim }}"
    cacheable: yes
  no_log: true

- name: Confirm a MISP API key was obtained
  ansible.builtin.assert:
    that:
      - misp_api_key | default('') | trim | length > 0
    fail_msg: >-
      The MISP admin authkey could not be read from
      `cake user change_authkey`. Nothing downstream can talk to MISP.
    success_msg: >-
      MISP API key obtained ({{ misp_api_key | length }} chars, fingerprint
      {{ (misp_api_key | hash('sha256'))[:12] }}).

- name: Inject MISP integration settings into DFIR-IRIS .env
  lineinfile:
    path: /opt/dfir-iris-custom/.env
    regexp: '^IRIS_MISP_URL='
    line: "IRIS_MISP_URL=https://{{ docker_server_internal_ip }}:8443"
    state: present

- name: Disable SSL verification for MISP connection
  lineinfile:
    path: /opt/dfir-iris-custom/.env
    regexp: '^IRIS_MISP_VERIFY_CERT='
    line: "IRIS_MISP_VERIFY_CERT=false"

- name: Inject MISP key into CICMS (DFIR-IRIS) .env
  lineinfile:
    path: /opt/dfir-iris-custom/.env
    regexp: '^IRIS_MISP_KEY='
    line: "IRIS_MISP_KEY={{ misp_api_key }}"
    state: present

# ── Fix the upstream server name in .env BEFORE building ─────────────────────

- name: Fix IRIS_UPSTREAM_SERVER to match actual container/service name
  ansible.builtin.lineinfile:
    path: /opt/dfir-iris-custom/.env
    regexp: '^IRIS_UPSTREAM_SERVER='
    line: "IRIS_UPSTREAM_SERVER=iris_app"
    state: present

- name: Verify IRIS_UPSTREAM_PORT is set to 8000
  ansible.builtin.lineinfile:
    path: /opt/dfir-iris-custom/.env
    regexp: '^IRIS_UPSTREAM_PORT='
    line: "IRIS_UPSTREAM_PORT=8000"
    state: present

- name: Disable secure-only session cookie so HTTP access works
  ansible.builtin.lineinfile:
    path: /opt/dfir-iris-custom/.env
    regexp: '^#?SESSION_COOKIE_SECURE='
    line: "SESSION_COOKIE_SECURE=False"
    state: present

# ── Pre-generate TLS certs so nginx has them on first boot ───────────────────

- name: Create nginx-certs directory on host
  ansible.builtin.file:
    path: /opt/dfir-iris-custom/nginx-certs
    state: directory
    mode: '0755'

- name: Generate self-signed TLS cert for iris_nginx
  ansible.builtin.shell: |
    openssl req -x509 -nodes -days 3650 -newkey rsa:2048 \
      -keyout /opt/dfir-iris-custom/nginx-certs/iris_dev_key.pem \
      -out /opt/dfir-iris-custom/nginx-certs/iris_dev_cert.pem \
      -subj '/C=XX/ST=CyberRange/L=Lab/O=IRIS/CN=iris.app.dev'
    chmod 644 /opt/dfir-iris-custom/nginx-certs/iris_dev_key.pem
    chmod 644 /opt/dfir-iris-custom/nginx-certs/iris_dev_cert.pem
  args:
    creates: /opt/dfir-iris-custom/nginx-certs/iris_dev_cert.pem

- name: Patch docker-compose.yml — mount certs into nginx and expose port 443
  ansible.builtin.shell: |
    python3 <<'PYEOF'
    path = '/opt/dfir-iris-custom/docker-compose.yml'
    with open(path) as f:
        content = f.read()

    changed = False

    # Fix port mapping 8083:80 → 8083:443 (nginx serves HTTPS on 443, not 80)
    if '"8083:80"' in content:
        content = content.replace('"8083:80"', '"8083:443"', 1)
        changed = True

    # Add cert volumes to nginx service (insert before depends_on block)
    if 'nginx-certs' not in content:
        old = '    depends_on:\n      - iris_app\n    networks:\n      - iris_backend\n      - iris_frontend'
        new = (
            '    volumes:\n'
            '      - ./nginx-certs/iris_dev_cert.pem:/www/certs/iris_dev_cert.pem:ro\n'
            '      - ./nginx-certs/iris_dev_key.pem:/www/certs/iris_dev_key.pem:ro\n'
            '    depends_on:\n      - iris_app\n    networks:\n      - iris_backend\n      - iris_frontend'
        )
        if old in content:
            content = content.replace(old, new, 1)
            changed = True

    if changed:
        with open(path, 'w') as f:
            f.write(content)
        print('patched')
    else:
        print('already_patched')
    PYEOF
  register: compose_patch
  changed_when: "'patched' in compose_patch.stdout"

# ── Make the image build independent of github.com egress (Option 2) ─────────
# evtx2splunk pulls splunk-hec from git+https://github.com/... during
# `pip3 install -r requirements.txt`. The sandbox's git clone to github.com is
# reset ("Recv failure: Connection reset by peer", exit 128), which fails the
# iris_app/worker image build and aborts the whole deployment on this first
# play. PUC2 2c does not use the IRIS EVTX import pipeline, so comment out that
# dependency chain (evtx2splunk + iris_evtx) to remove the git clone entirely.
# Idempotent; every other requirement is left untouched.

- name: Drop the git-backed EVTX dependency from DFIR-IRIS requirements
  ansible.builtin.shell: |
    python3 <<'PYEOF'
    import re
    path = '/opt/dfir-iris-custom/source/requirements.txt'
    try:
        with open(path) as f:
            lines = f.readlines()
    except FileNotFoundError:
        print('no_requirements')
        raise SystemExit(0)
    changed = False
    out = []
    for ln in lines:
        s = ln.strip()
        if s and not s.startswith('#') and re.search(r'evtx2splunk|iris_evtx', s):
            out.append('# PUC2-2c disabled (github egress): ' + ln.rstrip('\n') + '\n')
            changed = True
        else:
            out.append(ln)
    if changed:
        with open(path, 'w') as f:
            f.writelines(out)
        print('patched')
    else:
        print('already_patched')
    PYEOF
  register: iris_reqs_patch
  changed_when: "'patched' in iris_reqs_patch.stdout"

# Compose v2 warns once per run that the top-level `version:` key is obsolete
# and ignored. It is: the Compose Specification dropped it. Removing the key is
# exactly what the warning asks for and changes nothing about the deployment.
# Anchored to the start of the line so a `version:` nested inside a service
# definition is never touched.
- name: Drop the obsolete top-level version key from the DFIR-IRIS compose file
  ansible.builtin.lineinfile:
    path: /opt/dfir-iris-custom/docker-compose.yml
    regexp: '^version:'
    state: absent

# ── Build and run — retried against transient network resets ─────────────────
# The retry stays: a reset mid-build is real and a second attempt fixes it.
# What it must NOT do is keep retrying a rate limit. See
# defaults/main.yml (docker_hub_rate_limit_pattern) for why.
- name: Build and run DFIR-IRIS
  block:
    - name: Build and run DFIR-IRIS
      community.docker.docker_compose_v2:
        project_src: "/opt/dfir-iris-custom"
        state: present
        build: always
      register: dfir_iris_output
      # Stop the loop on success OR on a rate limit. Breaking out on 429 does
      # not make the task pass - it still fails, into the rescue below - it just
      # fails after ONE attempt with the right diagnosis instead of after five
      # and 2.5 minutes with the wrong one.
      until: >-
        dfir_iris_output is succeeded
        or ((dfir_iris_output.msg | default('') ~ ' ' ~ dfir_iris_output.stderr | default('')) | lower
            is search(docker_hub_rate_limit_pattern))
      retries: 5
      delay: 30

  rescue:
    - name: Say whether this was the rate limit or a genuine build failure
      ansible.builtin.fail:
        msg: >-
          {% if (dfir_iris_output.msg | default('') ~ ' ' ~ dfir_iris_output.stderr | default('')) | lower
                is search(docker_hub_rate_limit_pattern) %}
          DFIR-IRIS could not be built. {{ docker_hub_rate_limit_help }}
          Stopped after {{ dfir_iris_output.attempts | default(1) }} attempt(s) rather
          than retrying into the same limit. Docker said:
          {{ dfir_iris_output.msg | default('(no message)') }}
          {% else %}
          DFIR-IRIS could not be built, and it is NOT a Docker Hub rate limit -
          the retry budget ({{ dfir_iris_output.attempts | default('?') }} attempts)
          was spent on a real failure. Docker said:
          {{ dfir_iris_output.msg | default('(no message)') }}
          {{ dfir_iris_output.stderr | default('') }}
          {% endif %}

# ── Wait for iris_app healthy ─────────────────────────────────────────────────

- name: Wait for iris_app container to become healthy
  community.docker.docker_container_info:
    name: iris_app
  register: iris_app_info
  until: iris_app_info.container.State.Health.Status == "healthy"
  retries: 36
  delay: 5

# ── Certs are volume-mounted from nginx-certs/ — nginx starts with them ──────
# ── Restart to ensure clean state after compose up ───────────────────────────

- name: Restart iris_nginx
  ansible.builtin.command:
    cmd: docker restart iris_nginx
  changed_when: true

- name: Wait for iris_nginx to stabilise
  ansible.builtin.pause:
    seconds: 8

# ── Wait for port 8083 ────────────────────────────────────────────────────────

- name: Wait for DFIR-IRIS nginx port 8083
  ansible.builtin.wait_for:
    host: 127.0.0.1
    port: 8083
    state: started
    delay: 2
    timeout: 60

# ── Resolve DFIR-IRIS API key ─────────────────────────────────────────────────

- name: Test known DFIR-IRIS API key against live instance
  ansible.builtin.uri:
    url: "https://localhost:8083/api/v1/users/me"
    method: GET
    headers:
      Authorization: "Bearer {{ iris_bootstrap_api_key }}"
      Content-Type: "application/json"
    validate_certs: false
    status_code: [200, 401, 403]
    timeout: 15
  register: iris_key_test
  ignore_errors: true
  no_log: true          # the Authorization header is a credential
  # Skipped when no bootstrap key is configured, which is the default: an empty
  # bearer token can only ever be rejected, and the DB fallback below is the
  # path that actually produces the key.
  when: iris_bootstrap_api_key | default('') | trim | length > 0

# ── Extract key from DB if hardcoded key was rejected ────────────────────────

- name: Extract DFIR-IRIS API key from DB (column api_key)
  community.docker.docker_container_exec:
    container: iris_db
    command: >
      psql -U postgres -d iris_db -t -A -c
      "SELECT api_key FROM \"user\" WHERE name = 'administrator' LIMIT 1;"
  register: iris_db_key_api_key
  when: iris_key_test.status | default(0) != 200
  ignore_errors: true
  no_log: true          # stdout IS the API key

- name: Extract DFIR-IRIS API key from DB (column auth_key fallback)
  community.docker.docker_container_exec:
    container: iris_db
    command: >
      psql -U postgres -d iris_db -t -A -c
      "SELECT auth_key FROM \"user\" WHERE name = 'administrator' LIMIT 1;"
  register: iris_db_key_auth_key
  when:
    - iris_key_test.status | default(0) != 200
    - iris_db_key_api_key.stdout is not defined or iris_db_key_api_key.stdout | trim == ''
  ignore_errors: true
  no_log: true          # stdout IS the API key

# ── Resolve and save key ──────────────────────────────────────────────────────

- name: Set iris_api_key — from the bootstrap key (only if it still authenticates)
  ansible.builtin.set_fact:
    iris_api_key: "{{ iris_bootstrap_api_key }}"
    cacheable: yes
  when: iris_key_test.status | default(0) == 200
  no_log: true

- name: Set iris_api_key — from DB column api_key
  ansible.builtin.set_fact:
    iris_api_key: "{{ iris_db_key_api_key.stdout | trim }}"
    cacheable: yes
  when:
    - iris_key_test.status | default(0) != 200
    - iris_db_key_api_key is defined
    - iris_db_key_api_key.stdout is defined
    - iris_db_key_api_key.stdout | trim != ''

- name: Set iris_api_key — from DB column auth_key (fallback)
  ansible.builtin.set_fact:
    iris_api_key: "{{ iris_db_key_auth_key.stdout | trim }}"
    cacheable: yes
  when:
    - iris_key_test.status | default(0) != 200
    - iris_api_key is not defined
    - iris_db_key_auth_key is defined
    - iris_db_key_auth_key.stdout is defined
    - iris_db_key_auth_key.stdout | trim != ''

- name: FAIL — could not obtain a valid DFIR-IRIS API key
  ansible.builtin.fail:
    # Reports the LENGTH of each candidate, never the value: this message used
    # to print the freshly minted key in cleartext into the build log, which is
    # how a live credential ends up in an artefact nobody treats as a secret.
    msg: >
      Could not obtain a working DFIR-IRIS API key.
      Bootstrap key test: {{ iris_key_test.status | default('not configured') }}.
      DB api_key column:  {{ iris_db_key_api_key.stdout | default('') | trim | length }} chars.
      DB auth_key column: {{ iris_db_key_auth_key.stdout | default('') | trim | length }} chars.
      Both zero means the query returned nothing: check the `iris_db` container
      is up and which column holds the key in its `user` table.
  when: iris_api_key is not defined or iris_api_key | trim == ''

# ── Configure DFIR-IRIS modules via database ─────────────────────────────────

- name: Write IRIS module configuration script
  ansible.builtin.copy:
    dest: /tmp/iris_configure_modules.py
    mode: '0755'
    content: |
      #!/usr/bin/env python3
      # module_config is a JSON array of {param_name, value, ...} objects.
      # Fetch the array, patch the target element, write it back.
      import subprocess, json

      def psql_fetch(q):
          r = subprocess.run(
              ['docker','exec','iris_db','psql','-U','postgres','-d','iris_db','-t','-A','-c', q],
              capture_output=True, text=True)
          return r.stdout.strip()

      def psql_exec(q):
          r = subprocess.run(
              ['docker','exec','iris_db','psql','-U','postgres','-d','iris_db','-c', q],
              capture_output=True, text=True)
          return r.returncode, r.stdout.strip() or r.stderr.strip()

      updates = [
          (
              "iris_misp_module", "misp_config",
              json.dumps({
                  "name": "Public_MISP",
                  "type": "public",
                  "url":  ["https://{{ docker_server_internal_ip }}:8443"],
                  "key":  ["{{ misp_api_key }}"],
                  "ssl":  [False]
              }, indent=2)
          ),
          (
              "iris_webhooks_module", "wh_configuration",
              json.dumps({
                  "webhooks": [{
                      "name":       "SOARCA",
                      "url":        "http://{{ docker_server_internal_ip }}:8080/trigger/playbook",
                      "method":     "POST",
                      "trigger_on": ["alert_created", "case_created"]
                  }]
              }, indent=2)
          ),
      ]

      for module_name, param_name, new_value in updates:
          raw = psql_fetch(f"SELECT module_config FROM iris_module WHERE module_name = '{module_name}';")
          if not raw:
              print(f"SKIP: {module_name} not found"); continue
          config = json.loads(raw)
          for param in config:
              if param.get('param_name') == param_name:
                  param['value'] = new_value
                  break
          else:
              print(f"SKIP: param '{param_name}' not found in {module_name}"); continue
          safe = json.dumps(config).replace("'", "''")
          rc, out = psql_exec(
              f"UPDATE iris_module SET module_config = '{safe}'::json "
              f"WHERE module_name = '{module_name}';"
          )
          print(f"{'OK' if rc == 0 else 'FAIL'}: {module_name}/{param_name} → {out}")

- name: Apply IRIS module configurations
  ansible.builtin.command: python3 /tmp/iris_configure_modules.py
  register: iris_module_config
  changed_when: true

- name: Show module config results
  ansible.builtin.debug:
    msg: "{{ iris_module_config.stdout_lines }}"

- name: Restart iris_app to reload module configurations
  ansible.builtin.command: docker restart iris_app
  changed_when: true

- name: Wait for iris_app to be healthy after module config restart
  community.docker.docker_container_info:
    name: iris_app
  register: iris_app_info2
  until: iris_app_info2.container.State.Health.Status == "healthy"
  retries: 36
  delay: 5

######################## MISP MCP Server ######################################

- name: Install python3-pip for MCP servers
  ansible.builtin.apt:
    name: python3-pip
    state: present
  when: puc2_deploy_mcp_servers | default(false) | bool

- name: Install misp-mcp Python package from GitHub
  ansible.builtin.pip:
    name: "git+https://github.com/misp/misp-mcp.git"
    executable: pip3
    extra_args: --break-system-packages --ignore-installed
  when: puc2_deploy_mcp_servers | default(false) | bool

- name: Write MISP MCP credentials file
  ansible.builtin.copy:
    dest: /etc/misp-mcp.env
    mode: '0600'
    content: |
      MISP_URL=https://{{ docker_server_internal_ip }}:8443
      MISP_API_KEY={{ misp_api_key }}
      MISP_VERIFYCERT=false

- name: Deploy MISP MCP HTTP wrapper (streamable-HTTP, port 9001)
  ansible.builtin.copy:
    dest: /opt/misp-mcp-http.py
    mode: '0644'
    content: |
      #!/usr/bin/env python3
      """Run the misp-mcp FastMCP server over streamable-HTTP on port 9001 so
      remote clients (mcpo / Open WebUI / AnythingLLM / LibreChat) can reach it.
      Credentials come from /etc/misp-mcp.env (MISP_URL, MISP_API_KEY, MISP_VERIFYCERT)."""
      from misp_mcp.server import mcp
      from mcp.server.transport_security import TransportSecuritySettings

      if __name__ == "__main__":
          mcp.settings.host = "0.0.0.0"
          mcp.settings.port = 9001
          # Accept non-localhost Host headers (LAN IP / host.docker.internal / other
          # containers). Without this the SDK's DNS-rebinding protection returns HTTP
          # 421 to remote MCP clients. Safe on this trusted internal network.
          mcp.settings.transport_security = TransportSecuritySettings(
              enable_dns_rebinding_protection=False,
          )
          mcp.run(transport="streamable-http")
  when: puc2_deploy_mcp_servers | default(false) | bool

- name: Create misp-mcp systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/misp-mcp.service
    mode: '0644'
    content: |
      [Unit]
      Description=MISP MCP Server (HTTP mode, port 9001)
      After=network.target

      [Service]
      EnvironmentFile=/etc/misp-mcp.env
      ExecStart=/usr/bin/python3 /opt/misp-mcp-http.py
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  when: puc2_deploy_mcp_servers | default(false) | bool

- name: Reload systemd after creating misp-mcp service
  ansible.builtin.systemd:
    daemon_reload: yes
  when: puc2_deploy_mcp_servers | default(false) | bool

- name: Enable and start misp-mcp service
  ansible.builtin.service:
    name: misp-mcp
    enabled: yes
    state: started
  when: puc2_deploy_mcp_servers | default(false) | bool

######################## DFIR-IRIS MCP Server (iris-mcp, HTTP mode) ###########

- name: Ensure python3-venv is present (required for venv creation below)
  ansible.builtin.apt:
    name: python3-venv
    state: present
  when: puc2_deploy_mcp_servers | default(false) | bool

- name: Clone iris-mcp repository
  git:
    repo: "https://github.com/srozb/iris-mcp.git"
    dest: /opt/iris-mcp
  when: puc2_deploy_mcp_servers | default(false) | bool

- name: Create iris-mcp Python virtual environment
  command:
    cmd: python3 -m venv /opt/iris-mcp/venv
    creates: /opt/iris-mcp/venv/bin/python3
  when: puc2_deploy_mcp_servers | default(false) | bool

- name: Install iris-mcp Python dependencies
  ansible.builtin.pip:
    name:
      - "dfir-iris-client>=2.0.4"
      - "fastmcp>=2.13.2"
    virtualenv: /opt/iris-mcp/venv
  when: puc2_deploy_mcp_servers | default(false) | bool

- name: Write DFIR-IRIS MCP credentials file
  ansible.builtin.copy:
    dest: /etc/iris-mcp.env
    mode: '0600'
    content: |
      IRIS_HOST=https://127.0.0.1:8083
      IRIS_API_KEY={{ iris_api_key }}
      IRIS_VERIFY_SSL=false

- name: Deploy iris-mcp HTTP wrapper (binds 0.0.0.0:9000 for remote/container MCP clients)
  ansible.builtin.copy:
    dest: /opt/iris-mcp-http.py
    mode: '0644'
    content: |
      #!/usr/bin/env python3
      """Run iris-mcp's FastMCP server over HTTP on 0.0.0.0:9000 so remote clients
      / containers (AnythingLLM, LibreChat) can reach it. The stock iris_mcp.py binds
      127.0.0.1 in --http mode; this loads it as a module (skipping its stdio __main__
      block) and serves the FastMCP instance on all interfaces."""
      import importlib.util, sys
      from fastmcp import FastMCP

      sys.path.insert(0, "/opt/iris-mcp")   # so iris_mcp.py's local imports (types_catalog, ...) resolve
      spec = importlib.util.spec_from_file_location("iris_mcp", "/opt/iris-mcp/iris_mcp.py")
      mod = importlib.util.module_from_spec(spec)
      sys.argv = ["iris_mcp"]                # stop --http/args being re-parsed
      spec.loader.exec_module(mod)           # __name__ != "__main__" -> its run() is skipped

      server = next(v for v in vars(mod).values() if isinstance(v, FastMCP))
      server.run(transport="http", host="0.0.0.0", port=9000)
  when: puc2_deploy_mcp_servers | default(false) | bool

- name: Create iris-mcp systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/iris-mcp.service
    mode: '0644'
    content: |
      [Unit]
      Description=DFIR-IRIS MCP Server (HTTP mode, port 9000)
      After=network.target

      [Service]
      WorkingDirectory=/opt/iris-mcp
      EnvironmentFile=/etc/iris-mcp.env
      ExecStart=/opt/iris-mcp/venv/bin/python3 /opt/iris-mcp-http.py
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  when: puc2_deploy_mcp_servers | default(false) | bool

- name: Reload systemd after creating iris-mcp service
  ansible.builtin.systemd:
    daemon_reload: yes
  when: puc2_deploy_mcp_servers | default(false) | bool

- name: Enable and start iris-mcp service
  ansible.builtin.service:
    name: iris-mcp
    enabled: yes
    state: started
  when: puc2_deploy_mcp_servers | default(false) | bool

######################## AnythingLLM (chat UI + native MCP client) ###########
# Talks to the MCP servers DIRECTLY over streamable-HTTP (misp :9001, iris :9000)
# via host.docker.internal, so it does NOT use mcpo. Replaces Open WebUI on :4000.

- name: Create AnythingLLM storage + plugins directory
  ansible.builtin.file:
    path: /opt/anythingllm/plugins
    state: directory
    mode: '0755'
  when: puc2_deploy_anythingllm | default(false) | bool

- name: Write AnythingLLM MCP servers config (MISP + DFIR-IRIS)
  ansible.builtin.copy:
    dest: /opt/anythingllm/plugins/anythingllm_mcp_servers.json
    mode: '0644'
    content: |
      {
        "mcpServers": {
          "misp":      { "type": "streamable", "url": "http://host.docker.internal:9001/mcp" },
          "dfir-iris": { "type": "streamable", "url": "http://host.docker.internal:9000/mcp" }
        }
      }
  when: puc2_deploy_anythingllm | default(false) | bool

- name: Ensure AnythingLLM storage is owned by the container user (uid 1000)
  ansible.builtin.file:
    path: /opt/anythingllm
    state: directory
    owner: "1000"
    group: "1000"
    recurse: yes
  when: puc2_deploy_anythingllm | default(false) | bool

- name: Run AnythingLLM container (host port 4000)
  community.docker.docker_container:
    name: anythingllm
    image: mintplexlabs/anythingllm:latest
    state: started
    restart_policy: always
    published_ports:
      - "4000:3001"
    capabilities:
      - SYS_ADMIN
    etc_hosts:
      host.docker.internal: host-gateway
    memory: "4g"
    memory_swap: "8g"
    env:
      STORAGE_DIR: "/app/server/storage"
    volumes:
      - "/opt/anythingllm:/app/server/storage"
  when: puc2_deploy_anythingllm | default(false) | bool

######################## SACTI (Secure Aggregated CTI) ########################

- name: Install SACTI build dependencies
  ansible.builtin.apt:
    name:
      - cmake
      - ninja-build
      - libssl-dev
      - python3-venv
    state: present
    update_cache: yes
  when: puc2_deploy_sacti | default(false) | bool

- name: Clone liboqs (Open Quantum Safe C library)
  git:
    repo: "https://github.com/open-quantum-safe/liboqs.git"
    dest: /opt/liboqs
    version: main
    force: yes
  when: puc2_deploy_sacti | default(false) | bool

- name: Build and install liboqs shared library
  ansible.builtin.shell: |
    cmake -S /opt/liboqs -B /opt/liboqs/build \
      -DBUILD_SHARED_LIBS=ON \
      -DCMAKE_INSTALL_PREFIX=/usr/local \
      -GNinja
    cmake --build /opt/liboqs/build -- -j$(nproc)
    cmake --install /opt/liboqs/build
    ldconfig
    touch /opt/liboqs/.build_complete
  args:
    creates: /opt/liboqs/.build_complete
  when: puc2_deploy_sacti | default(false) | bool

- name: Clone SACTI repository
  git:
    repo: "https://github.com/COSSAS/SACTI.git"
    dest: /opt/sacti
    force: yes
  when: puc2_deploy_sacti | default(false) | bool

- name: Create SACTI Python virtual environment
  command:
    cmd: python3 -m venv /opt/sacti/venv
    creates: /opt/sacti/venv/bin/python3
  when: puc2_deploy_sacti | default(false) | bool

- name: Install SACTI Python dependencies
  ansible.builtin.pip:
    requirements: /opt/sacti/requirements.txt
    virtualenv: /opt/sacti/venv
    virtualenv_python: python3
  environment:
    LD_LIBRARY_PATH: /usr/local/lib
  when: puc2_deploy_sacti | default(false) | bool

- name: Patch SACTI config.py — set MISP_KEY
  ansible.builtin.lineinfile:
    path: /opt/sacti/sacti/config.py
    regexp: '^MISP_KEY\s*='
    line: "MISP_KEY = '{{ misp_api_key }}'"
    state: present
  when: puc2_deploy_sacti | default(false) | bool

- name: Patch SACTI config.py — set MISP_URL
  ansible.builtin.lineinfile:
    path: /opt/sacti/sacti/config.py
    regexp: '^MISP_URL\s*='
    line: "MISP_URL = 'https://{{ docker_server_internal_ip }}:8443'"
    state: present
  when: puc2_deploy_sacti | default(false) | bool

- name: Patch SACTI config.py — update Sig_Alg for liboqs 0.10+ (Dilithium2 → ML-DSA-44)
  ansible.builtin.lineinfile:
    path: /opt/sacti/sacti/config.py
    regexp: '^Sig_Alg\s*='
    line: "Sig_Alg = 'ML-DSA-44'"
    state: present
  when: puc2_deploy_sacti | default(false) | bool

- name: Patch SACTI config.py — update Kem_Alg for liboqs 0.10+ (Kyber512 → ML-KEM-512)
  ansible.builtin.lineinfile:
    path: /opt/sacti/sacti/config.py
    regexp: '^Kem_Alg\s*='
    line: "Kem_Alg = 'ML-KEM-512'"
    state: present
  when: puc2_deploy_sacti | default(false) | bool

- name: Run SACTI PKI setup (post-quantum key generation, one-time)
  ansible.builtin.shell: |
    /opt/sacti/venv/bin/python3 sacti/pq_pki_utils.py && touch /opt/sacti/.pki_done
  args:
    chdir: /opt/sacti
    creates: /opt/sacti/.pki_done
  environment:
    LD_LIBRARY_PATH: /usr/local/lib
    PYTHONPATH: /opt/sacti
  when: puc2_deploy_sacti | default(false) | bool

- name: Create SACTI aggregator systemd service
  ansible.builtin.copy:
    dest: /etc/systemd/system/sacti-aggregator.service
    mode: '0644'
    content: |
      [Unit]
      Description=SACTI Aggregator (secure CTI sharing)
      After=network.target

      [Service]
      WorkingDirectory=/opt/sacti
      Environment=LD_LIBRARY_PATH=/usr/local/lib
      Environment=PYTHONPATH=/opt/sacti
      ExecStart=/opt/sacti/venv/bin/python3 sacti/aggregator.py
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  when: puc2_deploy_sacti | default(false) | bool

- name: Create SACTI party systemd template service
  ansible.builtin.copy:
    dest: /etc/systemd/system/sacti-party@.service
    mode: '0644'
    content: |
      [Unit]
      Description=SACTI Party %i
      After=network.target sacti-aggregator.service

      [Service]
      WorkingDirectory=/opt/sacti
      Environment=LD_LIBRARY_PATH=/usr/local/lib
      Environment=PYTHONPATH=/opt/sacti
      ExecStart=/opt/sacti/venv/bin/python3 sacti/party.py %i 801%i
      Restart=on-failure
      RestartSec=5

      [Install]
      WantedBy=multi-user.target
  when: puc2_deploy_sacti | default(false) | bool

- name: Reload systemd after creating SACTI services
  ansible.builtin.systemd:
    daemon_reload: yes
  when: puc2_deploy_sacti | default(false) | bool

- name: Enable and start SACTI aggregator
  ansible.builtin.service:
    name: sacti-aggregator
    enabled: yes
    state: started
  when: puc2_deploy_sacti | default(false) | bool

- name: Enable and start SACTI parties 1-3
  ansible.builtin.service:
    name: "sacti-party@{{ item }}"
    enabled: yes
    state: started
  loop:
    - 1
    - 2
    - 3
  when: puc2_deploy_sacti | default(false) | bool

# ── Unmount ───────────────────────────────────────────────────────────────────

- name: Unmount SMB share
  ansible.builtin.mount:
    path: "/mnt/smb_shared"
    state: unmounted
  when: true
