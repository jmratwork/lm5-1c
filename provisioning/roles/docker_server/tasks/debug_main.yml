    state: present

- name: Change BASE_URL in env for MISP
  lineinfile:
    path: /opt/misp-docker/.env
    regexp: '^#?\s*BASE_URL='
    line: 'BASE_URL=https://10.0.12.60:8443'
    state: present
    insertafter: EOF
    backup: yes

- name: Deployment of MISP Docker
  community.docker.docker_compose_v2:
    project_src: "/opt/misp-docker"
    state: present
#    build: always
