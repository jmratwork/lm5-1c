---
# =============================================================================
# role: common
# Baseline configuration shared by every sandbox node.
# =============================================================================

- name: Set system timezone
  ansible.builtin.timezone:
    name: "{{ common_timezone }}"

- name: Update apt cache
  ansible.builtin.apt:
    update_cache: true
    cache_valid_time: 3600
  when: ansible_os_family == "Debian"

- name: Install baseline packages
  ansible.builtin.apt:
    name: "{{ common_base_packages }}"
    state: present
  when: ansible_os_family == "Debian"

- name: Ensure rsyslog is present (forwarding source for NG-SIEM)
  ansible.builtin.apt:
    name: rsyslog
    state: present
  when: ansible_os_family == "Debian"

- name: Ensure rsyslog is running
  ansible.builtin.service:
    name: rsyslog
    state: started
    enabled: true
