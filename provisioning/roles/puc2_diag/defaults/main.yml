---
# role: puc2_diag — read-only forensics for the PUC2 2c preflight gate.
# Nothing here changes the sandbox. Values are overridable with -e.

# Where the report lands on the ANSIBLE CONTROLLER (this repository).
puc2_diag_report: "{{ playbook_dir }}/../diagnostics/DIAGNOSIS.md"

# On-host credential files written by the substrate docker_server role. These
# hold the keys the live services actually accept, which is why the diagnosis
# trusts them over anything the overlay carries in a variable.
puc2_diag_misp_env: /etc/misp-mcp.env
puc2_diag_iris_env: /etc/iris-mcp.env

# SHA-256 of the IRIS key hardcoded in docker_server/tasks/main.yml. The key
# itself is NOT repeated here: a fingerprint is enough to recognise it and adds
# no new plaintext copy of a credential to the repository.
puc2_diag_stale_iris_key_sha256: "727f0285349e973adacc201629ed37cc21d56c2974f6b5a0afa22b37ff6c8887"
