---
# =============================================================================
# role: puc2_rehearsal   (hosts: ng-siem, victim, docker-server — every build)
#
# On its own, against an already-provisioned sandbox:
#   ansible-playbook provisioning/playbook.yml \
#     --tags puc2_rehearsal --limit ng-siem,victim,docker-server
#
# WHY THIS EXISTS
# puc2_preflight proves, statically, that every graded answer is OBTAINABLE: the
# rules load, the watchlist carries the hash, the markers' script is in place.
# What it deliberately never does is FIRE the attack — so nothing has confirmed
# in runtime that rule 100101 actually alerts (L10), that 100103 correlates
# (L11/L12), or that the active response writes the markers (L19/L20/L21). That
# is the one place a student could still be blocked. This role closes it: it
# fires the real scenario, watches every link of
#   100101 -> 100102 -> 100103 -> active response -> markers -> quarantine
# and then removes every trace, so the range is handed to the student exactly as
# provisioning left it — never "already attacked".
#
# SAFETY MODEL
# - It runs BEFORE handover, never against a range in use by students.
# - puc2_rehearsal_enabled=false skips it cleanly, for a smoke deploy.
# - block/rescue/always: cleanup runs whether the chain passes, fails, or errors.
# - Tasks are guarded by inventory_hostname; the manager-side checks run on
#   ng-siem, the endpoint side on victim. No task touches docker-server; it is
#   in the play only so the trailing preflight re-run (added in a later change)
#   can reprove all three hosts.
#
# The full-pristine completion (baseline restart, credential restore, alerts.log
# purge) and the preflight re-run land in the next change on this branch; the
# `always` here already performs the essential rollback so the role is safe to
# run on its own.
# =============================================================================

# A disabled rehearsal is a deliberate operator choice, not an error — so it
# skips rather than fails. It does not skip QUIETLY: the whole point of promoting
# this role into the build is that "the runtime chain was never exercised" must
# never again be something you can only discover by reading 5,000 lines of
# deployment log.
- name: Announce that the runtime chain will NOT be proven
  ansible.builtin.debug:
    msg: >-
      REHEARSAL SKIPPED (puc2_rehearsal_enabled=false) — this range ships
      WITHOUT runtime proof of 100101 -> 100102 -> 100103 -> active response ->
      markers -> quarantine. The preflight gate below still proves every graded
      answer is obtainable statically, but nothing here confirms that rule
      100101's CDB lookup resolves, that 100103 correlates, or that containment
      writes the markers L19/L21 grade. Re-run without the flag before handing
      the sandbox to students.
  run_once: true
  when: not (puc2_rehearsal_enabled | bool)

- name: PUC2 2c rehearsal — fire the chain, verify it, then undo it
  when: puc2_rehearsal_enabled | bool
  block:

    # ── Readiness (victim) ───────────────────────────────────────────────────
    - name: Confirm the range is armed before firing
      ansible.builtin.command: "{{ puc2_injection_root }}/inject_scenario.sh --arm"
      register: puc2_reh_arm
      changed_when: false
      failed_when: puc2_arm_token not in puc2_reh_arm.stdout
      when: inventory_hostname == 'victim'

    # ── Snapshot alerts.log so the rehearsal's own alerts can be purged later ─
    - name: Record the alerts.log size before the injection
      ansible.builtin.stat:
        path: "{{ puc2_rehearsal_alerts_log }}"
      register: puc2_reh_alerts_before
      when: inventory_hostname == 'ng-siem'

    - name: Remember the pre-injection alerts.log offset
      ansible.builtin.set_fact:
        puc2_reh_alerts_offset: "{{ puc2_reh_alerts_before.stat.size | default(0) }}"
      when: inventory_hostname == 'ng-siem'

    # ── Fire the scenario (victim) ───────────────────────────────────────────
    # Synchronous: the script returns after stage 4 (~3 x stage_pause seconds).
    # Every link is polled AFTER it returns.
    - name: Fire the malware scenario
      ansible.builtin.command: "{{ puc2_injection_root }}/inject_scenario.sh"
      environment:
        STAGE_PAUSE: "{{ puc2_rehearsal_stage_pause }}"
      register: puc2_reh_fire
      changed_when: true
      when: inventory_hostname == 'victim'

    # ── Link 1-3: detection alerts on the manager (ng-siem) ──────────────────
    # Poll without failing the loop (failed_when:false), then assert with an
    # actionable message naming the exact link that never appeared.
    #
    # THESE FOUR CHECKS WERE UNFALSIFIABLE UNTIL 2026-09-10, in two independent
    # ways, and the first rehearsal ever to run reported four green links on a
    # range where the endpoint agent had never once connected:
    #
    #  * `grep ... | tail -1` returns TAIL's exit status, and tail always
    #    succeeds. Asserting on `.rc == 0` therefore asserted nothing. Links 2
    #    and 4 matched no line at all and passed anyway. Hence `set -o pipefail`
    #    AND a criterion on stdout - either alone would do, both because an
    #    assert that cannot fail has already cost this project three rounds.
    #
    #  * alerts.log is prose, so a rule id matches anywhere in the text. Links 1
    #    and 3 matched this role's own ossec.conf edit, quoted inside the diff of
    #    an unrelated syscheck alert. Reading alerts.json and matching the
    #    "id":"1001xx" FIELD makes a config diff unable to forge a detection.
    - name: Wait for rule 100101 (malware detected — L10)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -a -F '"id":"100101"' {{ puc2_rehearsal_alerts_json }} | tail -1
        executable: /bin/bash
      register: puc2_reh_100101
      changed_when: false
      failed_when: false
      until: puc2_reh_100101.stdout | default('') | length > 0
      retries: "{{ puc2_rehearsal_alert_retries }}"
      delay: "{{ puc2_rehearsal_alert_delay }}"
      when: inventory_hostname == 'ng-siem'

    - name: Assert 100101 alerted
      ansible.builtin.assert:
        that: puc2_reh_100101.stdout | default('') | length > 0
        fail_msg: >-
          LINK 1 BROKEN — rule 100101 never alerted after firing the payload.
          The hash-match detection (training L10) is not producing an alert.
          Check ng_siem_rules_2c (rule 100101 / CDB watchlist) and that the
          victim agent's FIM telemetry is reaching the manager.
      when: inventory_hostname == 'ng-siem'

    - name: Wait for rule 100102 (blocked C2 beacon)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -a -F '"id":"100102"' {{ puc2_rehearsal_alerts_json }} | tail -1
        executable: /bin/bash
      register: puc2_reh_100102
      changed_when: false
      failed_when: false
      until: puc2_reh_100102.stdout | default('') | length > 0
      retries: "{{ puc2_rehearsal_alert_retries }}"
      delay: "{{ puc2_rehearsal_alert_delay }}"
      when: inventory_hostname == 'ng-siem'

    - name: Assert 100102 alerted
      ansible.builtin.assert:
        that: puc2_reh_100102.stdout | default('') | length > 0
        fail_msg: >-
          LINK 2 BROKEN — rule 100102 never alerted. The blocked C2 beacon is
          not being decoded into an alert. Check the baseline egress filter on
          victim (PUC2-FW-DROP on tcp/{{ puc2_c2_port | default(4444) }}),
          kern.log ingestion, and rule 100102's if_sid/match.
      when: inventory_hostname == 'ng-siem'

    - name: Wait for rule 100103 (correlated targeted attack — L11/L12)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -a -F '"id":"100103"' {{ puc2_rehearsal_alerts_json }} | tail -1
        executable: /bin/bash
      register: puc2_reh_100103
      changed_when: false
      failed_when: false
      until: puc2_reh_100103.stdout | default('') | length > 0
      retries: "{{ puc2_rehearsal_alert_retries }}"
      delay: "{{ puc2_rehearsal_alert_delay }}"
      when: inventory_hostname == 'ng-siem'

    - name: Assert 100103 correlated
      ansible.builtin.assert:
        that: puc2_reh_100103.stdout | default('') | length > 0
        fail_msg: >-
          LINK 3 BROKEN — rule 100103 never correlated (training L11/L12). The
          repeated-IOC correlation that confirms a targeted attack — and fires
          containment — did not trigger. Confirm the injection is multi-stage
          (100101 must fire more than once inside the window) and 100103's
          frequency/timeframe/if_matched_sid.
      when: inventory_hostname == 'ng-siem'

    # ── Link 4-7: response on the endpoint (victim) ──────────────────────────
    - name: Wait for the active response to execute (L19/L20)
      ansible.builtin.shell:
        cmd: |
          set -o pipefail
          grep -a -F 'puc2-isolate' {{ puc2_rehearsal_ar_log }} | tail -1
        executable: /bin/bash
      register: puc2_reh_ar
      changed_when: false
      failed_when: false
      until: puc2_reh_ar.stdout | default('') | length > 0
      retries: "{{ puc2_rehearsal_marker_retries }}"
      delay: "{{ puc2_rehearsal_marker_delay }}"
      when: inventory_hostname == 'victim'

    - name: Assert the active response ran
      ansible.builtin.assert:
        that: puc2_reh_ar.stdout | default('') | length > 0
        fail_msg: >-
          LINK 4 BROKEN — the puc2-isolate active response never executed. Rule
          100103 fired but the manager did not run the containment action on the
          endpoint. Check the <active-response>/<command> wiring in
          ng_siem_rules_2c and that puc2-isolate is executable on victim.
      when: inventory_hostname == 'victim'

    - name: Wait for the isolation marker to read 'isolated' (L19)
      ansible.builtin.shell: >-
        head -1 {{ puc2_isolation_marker }}
      register: puc2_reh_iso
      changed_when: false
      failed_when: false
      until:
        - puc2_reh_iso.rc == 0
        - puc2_reh_iso.stdout == puc2_isolation_status
      retries: "{{ puc2_rehearsal_marker_retries }}"
      delay: "{{ puc2_rehearsal_marker_delay }}"
      when: inventory_hostname == 'victim'

    - name: Assert the isolation marker is correct
      ansible.builtin.assert:
        that:
          - puc2_reh_iso.rc == 0
          - puc2_reh_iso.stdout == puc2_isolation_status
        fail_msg: >-
          LINK 5 BROKEN — {{ puc2_isolation_marker }} does not read
          '{{ puc2_isolation_status }}' on its first line (training L19). Got:
          '{{ puc2_reh_iso.stdout | default("<absent>") }}'.
      when: inventory_hostname == 'victim'

    - name: Wait for the eradication marker to read 'eradicated' (L21)
      ansible.builtin.shell: >-
        head -1 {{ puc2_eradication_marker }}
      register: puc2_reh_erad
      changed_when: false
      failed_when: false
      until:
        - puc2_reh_erad.rc == 0
        - puc2_reh_erad.stdout == puc2_eradication_status
      retries: "{{ puc2_rehearsal_marker_retries }}"
      delay: "{{ puc2_rehearsal_marker_delay }}"
      when: inventory_hostname == 'victim'

    - name: Assert the eradication marker is correct
      ansible.builtin.assert:
        that:
          - puc2_reh_erad.rc == 0
          - puc2_reh_erad.stdout == puc2_eradication_status
        fail_msg: >-
          LINK 6 BROKEN — {{ puc2_eradication_marker }} does not read
          '{{ puc2_eradication_status }}' on its first line (training L21). Got:
          '{{ puc2_reh_erad.stdout | default("<absent>") }}'.
      when: inventory_hostname == 'victim'

    - name: Confirm the payload was quarantined (L21)
      ansible.builtin.find:
        paths: "{{ puc2_quarantine_dir }}"
        file_type: any
      register: puc2_reh_quar
      until: puc2_reh_quar.matched | int > 0
      retries: "{{ puc2_rehearsal_marker_retries }}"
      delay: "{{ puc2_rehearsal_marker_delay }}"
      failed_when: false
      when: inventory_hostname == 'victim'

    - name: Assert the quarantine holds the payload
      ansible.builtin.assert:
        that: puc2_reh_quar.matched | int > 0
        fail_msg: >-
          LINK 7 BROKEN — {{ puc2_quarantine_dir }} is empty; the payload was
          never quarantined (training L21).
      when: inventory_hostname == 'victim'

    - name: Record that the chain passed on this host
      ansible.builtin.set_fact:
        puc2_reh_chain_ok: true

  rescue:
    - name: Record that the chain failed on this host
      ansible.builtin.set_fact:
        puc2_reh_chain_ok: false
        puc2_reh_failure: "{{ ansible_failed_result.msg | default('unknown failure') }}"

    - name: Surface the broken link
      ansible.builtin.debug:
        msg: "REHEARSAL FAILED on {{ inventory_hostname }}: {{ puc2_reh_failure }}"

  always:
    # ── Cleanup — runs on pass, fail or error; leaves the range pristine ──────
    # Undoes everything the active response applied and everything the injection
    # dropped, so puc2_preflight (re-run at the end of this role) goes green again
    # and the student meets a freshly provisioned range, never an attacked one.
    - name: Roll back containment via the active response's own delete path
      ansible.builtin.shell:
        cmd: >-
          echo '{"version":1,"command":"delete","parameters":{"program":"puc2-isolate"}}'
          | /var/ossec/active-response/bin/puc2-isolate
      register: puc2_reh_rollback
      changed_when: true
      failed_when: false
      when: inventory_hostname == 'victim'

    # The AR's delete path removes the 0.0.0.0 sinkhole line but does not restore
    # the observable one; without it the arm check 'C2 domain resolves' fails.
    - name: Restore the C2 sinkhole line provisioning seeds
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '\s{{ puc2_c2_domain | regex_escape }}$'
        line: "{{ puc2_c2_ip }} {{ puc2_c2_domain }}"
      when: inventory_hostname == 'victim'

    - name: Empty the quarantine directory
      ansible.builtin.shell:
        cmd: "rm -rf {{ puc2_quarantine_dir }}/* 2>/dev/null; true"
      changed_when: true
      when: inventory_hostname == 'victim'

    - name: Remove any payload copies the injection left behind
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop: "{{ puc2_delivery_paths + ['/tmp/payload.sh', '/home/' + puc2_victim_user + '/' + 'invoice.exe'] }}"
      when: inventory_hostname == 'victim'

    - name: Remove the containment status markers
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ puc2_isolation_marker }}"
        - "{{ puc2_eradication_marker }}"
      when: inventory_hostname == 'victim'

    # The AR's delete path resets the INPUT/OUTPUT policies to ACCEPT and removes
    # the C2 drop and the SSH rules, but it does NOT remove the six allow rules
    # isolate_host inserted (ESTABLISHED/RELATED, loopback, sandbox CIDR). With
    # policy ACCEPT they are functionally inert, but they are not what
    # provisioning left, so a pristine restore deletes them explicitly. -D of a
    # rule that is already gone errors harmlessly, hence `|| true` on each.
    - name: Delete the allow rules isolate_host left behind
      ansible.builtin.shell:
        cmd: |
          iptables -D INPUT  -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT 2>/dev/null || true
          iptables -D OUTPUT -m conntrack --ctstate ESTABLISHED,RELATED -j ACCEPT 2>/dev/null || true
          iptables -D INPUT  -i lo -j ACCEPT 2>/dev/null || true
          iptables -D OUTPUT -o lo -j ACCEPT 2>/dev/null || true
          iptables -D INPUT  -s {{ puc2_sandbox_cidr }} -j ACCEPT 2>/dev/null || true
          iptables -D OUTPUT -d {{ puc2_sandbox_cidr }} -j ACCEPT 2>/dev/null || true
          true
      changed_when: true
      when: inventory_hostname == 'victim'

    # Reassert the provisioned baseline egress filter. Its unit uses `-C` before
    # `-I`, so a restart re-adds the tcp/{{ puc2_c2_port | default(4444) }}
    # LOG+DROP only if it is missing and never stacks — the one firewall state
    # the range is meant to keep. Never `iptables -F`: that would take out rules
    # other roles own.
    - name: Reassert the baseline egress filter
      ansible.builtin.systemd:
        name: puc2-fw-baseline
        state: restarted
      failed_when: false
      when: inventory_hostname == 'victim'

    # The AR expired the victim password (chage -d 0) and killed its sessions.
    # Set the last-change date back to today so the account is not stuck in a
    # forced-change state the student would trip over.
    - name: Restore the victim account's password state
      ansible.builtin.command: "chage -d {{ ansible_date_time.date }} {{ puc2_victim_user }}"
      changed_when: true
      failed_when: false
      when: inventory_hostname == 'victim'

    # Purge the rehearsal's own alerts by truncating alerts.log back to the byte
    # offset snapshotted before the injection. This is what keeps the manager's
    # alert view "freshly deployed": the student sees no PUC2 alerts until they
    # fire the scenario themselves. Trade-off, acceptable pre-student: any alert
    # any agent wrote during the rehearsal window is dropped too. The byte count
    # removed is recorded for the report.
    - name: Measure alerts.log before the purge
      ansible.builtin.stat:
        path: "{{ puc2_rehearsal_alerts_log }}"
      register: puc2_reh_alerts_after
      when: inventory_hostname == 'ng-siem'

    - name: Truncate alerts.log back to its pre-rehearsal size
      ansible.builtin.command: >-
        truncate -s {{ puc2_reh_alerts_offset | default(0) }} {{ puc2_rehearsal_alerts_log }}
      register: puc2_reh_alerts_purged
      changed_when: true
      failed_when: false
      when:
        - inventory_hostname == 'ng-siem'
        - puc2_reh_alerts_after.stat.size | default(0) | int > puc2_reh_alerts_offset | default(0) | int

    - name: Record how many bytes of rehearsal alerts were purged
      ansible.builtin.set_fact:
        puc2_reh_alerts_purged_bytes: >-
          {{ (puc2_reh_alerts_after.stat.size | default(0) | int)
             - (puc2_reh_alerts_offset | default(0) | int) }}
      when: inventory_hostname == 'ng-siem'

    - name: Report the cleanup outcome
      ansible.builtin.debug:
        msg: >-
          Cleanup done on {{ inventory_hostname }}.
          {% if inventory_hostname == 'ng-siem' %}Purged
          {{ puc2_reh_alerts_purged_bytes | default(0) }} bytes of rehearsal
          alerts.{% else %}Containment rolled back, sinkhole and baseline
          restored, quarantine emptied, markers removed.{% endif %}

  # ── Report — written once, from the controller, before anything can fail ────
  # Evidence is split across hosts (alert lines on ng-siem, markers on victim),
  # so the template reads both out of hostvars. Written before the preflight
  # re-run so the report survives even if that re-run trips.
  # The report is EVIDENCE, not a verdict, and it is written to the controller's
  # own checkout — which on the CyberRangeCZ runner is a throwaway clone under
  # /app/ansible_repo that nobody reads afterwards, and which may be read-only.
  # Now that this role gates every build, a controller that cannot take the file
  # must not be able to sink a range whose chain actually passed. The verdict
  # below is what fails the deployment; this only records the detail.
- name: Write the rehearsal report
  ansible.builtin.template:
    src: REHEARSAL_REPORT.md.j2
    dest: "{{ playbook_dir }}/../validation/REHEARSAL_REPORT.md"
    mode: '0644'
  delegate_to: localhost
  become: false
  run_once: true
  register: puc2_reh_report
  # ignore_errors, NOT failed_when:false — the latter rewrites `failed` to false,
  # which would make the notice below unreachable and the miss silent.
  ignore_errors: true
  when: puc2_rehearsal_enabled | bool

- name: Note that the rehearsal report could not be written
  ansible.builtin.debug:
    msg: >-
      Rehearsal report NOT written to validation/REHEARSAL_REPORT.md
      ({{ puc2_reh_report.msg | default('unknown reason') }}). The verdict below
      is unaffected — every link's evidence is in this deployment log.
  run_once: true
  when:
    - puc2_rehearsal_enabled | bool
    - puc2_reh_report.failed | default(false)

  # ── Re-prove the range is back to a handover-ready state ────────────────────
  # Criterion (3): cleanup must leave puc2_preflight green again. Running it here
  # rather than trusting the cleanup makes that a verified fact — and if anything
  # was not restored, this fails loudly, on the host where it is wrong.
  #
  # Skipped when the drill is: the preflight play runs immediately after this one
  # anyway, so re-including it here would only double a gate that already ran.
- name: Re-prove the preflight gate after the rehearsal
  ansible.builtin.include_role:
    name: puc2_preflight
  when: puc2_rehearsal_enabled | bool

  # ── Signal the rehearsal's own verdict ──────────────────────────────────────
  # Cleanup and the report are done; now fail non-zero if any link broke, so a
  # broken chain is never a silently green run. The report names which link.
  #
  # `default(false)` is the correct reading for a host that never recorded a
  # verdict — but ONLY while the drill ran. With the drill skipped no host records
  # anything, so this must be skipped too or turning the kill switch on would fail
  # every deployment for the crime of being switched off.
- name: Fail if any link of the chain broke
  ansible.builtin.assert:
    that:
      - hostvars['ng-siem'].puc2_reh_chain_ok | default(false)
      - hostvars['victim'].puc2_reh_chain_ok | default(false)
    fail_msg: >-
      Rehearsal FAILED — a link of the detection/response chain broke. See
      validation/REHEARSAL_REPORT.md for which one and the overlay to fix, or
      the LINK n BROKEN message earlier in this log. The range was still
      restored and preflight re-run.
    success_msg: >-
      Rehearsal PASSED — 100101 -> 100102 -> 100103 -> active response ->
      markers -> quarantine all confirmed in runtime, range restored, preflight
      green.
  run_once: true
  delegate_to: localhost
  when: puc2_rehearsal_enabled | bool
